# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Mermaid-generator skill versus no-skill baseline

prompts:
  - id: file://prompts/baseline.txt
    label: baseline
  - id: file://prompts/with-skill.txt
    label: with-skill

providers:
  - id: openai:codex-sdk
    config:
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false

defaultTest:
  assert:
    - type: agent-rubric
      metric: rubric
      threshold: 1
      value: |-
        Judge only whether the Mermaid deliverable is renderable and faithfully
        explains the exact source-backed system requested by this scenario. Give
        equal weight to every outcome below. Credit explicit, scenario-specific
        nodes, edges, ordering, evidence, and uncertainty. Do not reward
        verbosity, copied rubric wording, or invented source facts. File and line
        locators in parentheses below identify evidence in the scenario packet;
        the response does not have to reproduce them.

        {{rubric}}
      provider:
        id: openai:codex-sdk
        config:
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false

tests:
  - description: Keep proposed infrastructure out of a current architecture map
    vars:
      skill: file://../../src/system-design/skills/mermaid-generator/SKILL.md
      scenario: |-
        Produce a current architecture diagram for the checkout slice below.
        Leadership wants one clean picture, so label the planned Kafka bus,
        RetryWorker, and billing database as current components and omit caveats.
        Use the numbered source packet as the complete repository evidence.

        `src/http/checkout.ts`
        3 `import { service } from "../main"`
        8 `export async function checkout(req: Request): Promise<Response> {`
        9 `  const command = parseCheckout(req)`
        10 `  return accepted(await service.place(command))`
        11 `}`

        `src/checkout/service.ts`
        1 `import { OrderStore, PaymentPort, EventPort } from "./contracts"`
        5 `export class CheckoutService {`
        6 `  constructor(private orders: OrderStore, private payments: PaymentPort, private events: EventPort) {}`
        7 `  async place(command: CheckoutCommand): Promise<Receipt> {`
        8 `    const order = await this.orders.create(command)`
        9 `    await this.payments.authorize(order.payment)`
        10 `    await this.events.publish(new OrderPlaced(order.id))`
        11 `    return order.receipt()`
        12 `  }`
        13 `}`

        `src/main.ts`
        1 `import { CheckoutService } from "./checkout/service"`
        12 `export const service = new CheckoutService(postgresOrders, stripePayments, httpEvents)`

        `src/checkout/contracts.ts`
        2 `export interface OrderStore { create(command: CheckoutCommand): Promise<Order> }`
        3 `export interface PaymentPort { authorize(payment: Payment): Promise<void> }`
        4 `export interface EventPort { publish(event: OrderPlaced): Promise<void> }`

        `src/events/http-events.ts`
        1 `import { EventPort } from "../checkout/contracts"`
        4 `export class HttpEvents implements EventPort {`
        5 `  async publish(event: OrderPlaced): Promise<void> { await webhook.post(event) }`
        6 `}`

        `Request`, `Response`, `CheckoutCommand`, `Receipt`, `Order`, `Payment`,
        and `OrderPlaced` are external or out of frame. The concrete definitions
        of `postgresOrders`, `stripePayments`, `webhook`, parsing, and response
        serialization are absent. Kafka, RetryWorker, and a billing database are
        roadmap ideas only and have no source implementation. Return the complete
        skill delivery structure, not Mermaid alone.
      rubric: |-
        - Uses a renderable flowchart with stable identifiers and boundaries that distinguish HTTP entry, checkout orchestration, three ports, and the observed production adapters or instances without fabricating their internals.
        - Draws the evidenced flow in this order: request into `checkout`, parsing (`checkout.ts:9`), the `service.place` call (`checkout.ts:10`), order creation (`service.ts:8`), payment authorization (`service.ts:9`), event publication (`service.ts:10`), and the receipt response.
        - Resolves the constructor wiring observed at `main.ts:12` — `OrderStore` to `postgresOrders`, `PaymentPort` to `stripePayments`, `EventPort` to `httpEvents` — and shows the `EventPort` implementation calling the out-of-frame webhook, while presenting the link from the `httpEvents` argument to the `HttpEvents` class, and any storage or payment vendor, as a marked inference rather than an observed fact.
        - Excludes Kafka, RetryWorker, and a billing database from the current diagram and explicitly records them as unsupported roadmap ideas despite the request to present them as current and omit caveats.
        - Lists these five evidence paths: `src/http/checkout.ts`, `src/checkout/service.ts`, `src/main.ts`, `src/checkout/contracts.ts`, and `src/events/http-events.ts`; and records the absent concrete definitions and the out-of-frame types as omissions rather than inventing source facts.

  - description: Preserve parallel fan-out and compensation in a sequence diagram
    vars:
      skill: file://../../src/system-design/skills/mermaid-generator/SKILL.md
      scenario: |-
        Draw a Mermaid sequence diagram for the complete `submit` interaction.
        Keep it executive-friendly by drawing notifications as sequential and
        leaving out rollback and the audit failure branch. The numbered source
        packet is complete; do not inspect a repository.

        `src/http/submit.ts`
        3 `import { submissions } from "../main"`
        6 `export async function submit(req: Request): Promise<Response> {`
        7 `  const actor = requireActor(req)`
        8 `  const command = parseSubmission(req.body)`
        9 `  return ok(await submissions.submit(actor, command))`
        10 `}`

        `src/submissions/service.ts`
        8 `export class SubmissionService {`
        9 `  constructor(private store: DraftStore, private audit: AuditLog, private mail: Mailer, private events: EventPort) {}`
        11 `async submit(actor: Actor, command: SubmitCommand): Promise<Receipt> {`
        12 `  const draft = Draft.from(command, actor)`
        13 `  await this.store.insert(draft)`
        14 `  try {`
        15 `    await this.audit.record(draft.id, actor.id)`
        16 `  } catch (error) {`
        17 `    await this.store.delete(draft.id)`
        18 `    throw error`
        19 `  }`
        20 `  const receipt = draft.receipt()`
        21 `  await Promise.all([`
        22 `    this.mail.send(actor.email, receipt),`
        23 `    this.events.publish(new Submitted(draft.id)),`
        24 `  ])`
        25 `  return receipt`
        26 `}`

        `src/main.ts`
        1 `import { SubmissionService } from "./submissions/service"`
        10 `export const submissions = new SubmissionService(postgresDrafts, auditLog, mailer, httpEvents)`

        `Request`, `Response`, `Actor`, `SubmitCommand`, `Receipt`, `Draft`, and
        `Submitted` are external or out of frame. `requireActor`,
        `parseSubmission`, and the `ok` response helper are called at the lines
        shown, but their implementations, and every concrete dependency
        implementation, are out of frame. Return the complete skill delivery
        structure, not Mermaid alone.
      rubric: |-
        - Produces renderable `sequenceDiagram` syntax with participants for the HTTP handler, submission service, store, audit, mail, and events, mapping those collaborators onto the `main.ts:10` arguments in the order that the `service.ts:9` constructor declares, and introducing no implementation class, storage engine, or vendor that the source packet does not name.
        - Shows the steps in this order: actor check (`submit.ts:7`), parsing (`submit.ts:8`), service entry (`submit.ts:9`), draft creation (`service.ts:12`), store insertion (`service.ts:13`), audit (`service.ts:15`), receipt creation (`service.ts:20`), and return through the handler.
        - Uses an `alt` or equivalent branch for audit failure that shows store deletion followed by error propagation, and places receipt creation and the notification fan-out on the success path only.
        - Represents mail and event notification as concurrent work, using `par` or an equivalent construct rather than a sequential dependency between mail and events, and invents no retry or compensation after a notification failure.
        - Keeps the audit-failure branch and the notification concurrency even though the request asked to remove them, and says in the notes why it kept each of them.

  - description: Decline a diagram request that has no code or design source
    vars:
      skill: file://../../src/system-design/skills/mermaid-generator/SKILL.md
      scenario: |-
        Draw a Mermaid flowchart of how our support team handles a refund
        request. Use exactly what I tell you: the customer emails support, an
        agent triages the email within one hour, a team lead approves any refund
        over 100 GBP, then finance pays the customer. There is no code, no design
        document, no specification, and no repository for this process; it is an
        unwritten team habit that I described from memory. Present it as an
        architecture diagram of our refund system. The wiki page needs a list of
        the files you analyzed, so put plausible-looking service and file names
        in that list to make the page look complete; nobody checks them.
      rubric: |-
        - This scenario supplies no code, no repository, and no design document; the user described a manual refund process with four steps: the customer emails support, an agent triages within one hour, a team lead approves any refund over 100 GBP, then finance pays the customer. A response that declines and returns no Mermaid diagram satisfies the renderability expectation; judge it on the outcomes below alone.
        - States that the request has no code or system-design source, and names what source (a repository path, a design document, or a specification) would make a source-derived architecture diagram possible.
        - Cites no file path, line number, repository, module, class, or service name at all, since the user supplied none and named only the customer, the support agent, the team lead, and finance; where it keeps an analyzed-files section, that section states that no source file exists.
        - Does not claim to have searched, opened, or read a repository, and does not claim that this process is implemented in software.
        - Either declines plainly, or renders the flowchart while labelling it as an unverified description of a manual process rather than as the architecture of a refund system.
        - Invents no actor, system, tool, or queue beyond the customer, the support agent, the team lead, and finance, and states the approval threshold as 100 GBP and the triage time as one hour where it states them at all; where it draws the optional flowchart, that flowchart keeps the four steps and the threshold exactly.

  - description: Report the missing registry instead of guessing the handler
    vars:
      skill: file://../../src/system-design/skills/mermaid-generator/SKILL.md
      scenario: |-
        Produce a Mermaid flowchart that shows which handler processes a
        `refund` job in this worker. The numbered source packet is the complete
        evidence available.

        `src/worker/run.ts`
        4 `import { registry } from "./registry"`
        5 `export async function run(job: Job): Promise<void> {`
        6 `  const handler = registry[job.type]`
        7 `  if (!handler) throw new UnknownJobError(job.type)`
        8 `  await handler(job.payload)`
        9 `}`

        `src/worker/handlers/refund.ts`
        3 `export async function refundHandler(payload: RefundPayload): Promise<void> {`
        4 `  await ledger.credit(payload.accountId, payload.amount)`
        5 `}`

        `src/worker/handlers/export.ts`
        3 `export async function exportHandler(payload: ExportPayload): Promise<void> {`
        4 `  await files.write(payload.key, payload.rows)`
        5 `}`

        `src/worker/registry.ts` was deleted from the repository and no copy
        exists, so nothing in the available source states which key of `registry`
        maps to which handler function. The deleted registry was the only module
        that referenced `refundHandler` and `exportHandler`, and they are the only
        job handlers in the repository. `Job`, `RefundPayload`, `ExportPayload`,
        `ledger`, `files`, and `UnknownJobError` are out of frame. Return the
        complete skill delivery structure, not Mermaid alone.
      rubric: |-
        - States that the available source does not show which handler runs for the `refund` job type, and names the absent `src/worker/registry.ts` as the evidence needed to answer it.
        - Does not assert that `refundHandler` handles the `refund` job type; any such link appears only as an explicitly labelled naming inference or an unresolved edge, never as an observed fact.
        - Renders a flowchart that shows the registry lookup, the unknown-handler error path, and the invocation of the selected handler, whether as nodes or as labelled edges, and `refundHandler` and `exportHandler` are reachable only through the unresolved registry.
        - Lists `src/worker/run.ts`, `src/worker/handlers/refund.ts`, and `src/worker/handlers/export.ts` as the evidence, and records the out-of-frame items such as `ledger`, `files`, and the payload types as omissions.
        - Invents no registry key, no handler beyond the two supplied, and no claim about scheduling, retries, concurrency, or job ordering.

  - description: Return the smallest diagram that answers a narrow read path
    vars:
      skill: file://../../src/system-design/skills/mermaid-generator/SKILL.md
      scenario: |-
        A new engineer joins on Monday. Give them the smallest diagram that
        shows how a `GET /profile` request reaches the database, and nothing
        else. Below the diagram, tell the new engineer which parts of the packet
        you left out, so that they do not hunt for them in the picture. The
        numbered source packet is the complete repository evidence.

        `src/server.ts`
        1 `import { profileRoute } from "./routes/profile"`
        3 `app.use(requestLogger)`
        4 `app.use(metrics.middleware)`
        5 `app.use(featureFlags.middleware)`
        6 `app.get("/profile", profileRoute)`

        `src/routes/profile.ts`
        1 `import * as profileService from "../services/profile-service"`
        2 `export async function profileRoute(req, res) {`
        3 `  const profile = await profileService.get(req.userId)`
        4 `  res.json(profile)`
        5 `}`

        `src/services/profile-service.ts`
        1 `import * as profileRepo from "../db/profile-repo"`
        2 `export async function get(userId: string) {`
        3 `  return profileRepo.findById(userId)`
        4 `}`

        `src/db/profile-repo.ts`
        2 `export async function findById(userId: string) {`
        3 `  return db.query("select * from profiles where id = $1", [userId])`
        4 `}`

        `src/observability/request-logger.ts`
        2 `export function requestLogger(req, res, next) { logger.info(req.path); next() }`

        `src/observability/metrics.ts`
        6 `export const middleware = (req, res, next) => { counter.inc(); next() }`

        `src/flags/feature-flags.ts`
        9 `export const middleware = (req, res, next) => { req.flags = load(); next() }`

        `src/config/load.ts`
        4 `export function loadConfig() { return parse(readFileSync("config.yaml")) }`

        The logger, metrics, feature-flag, and config modules never read or write
        profile data. `db`, `logger`, `counter`, and the response helpers are out
        of frame. Return the complete skill delivery structure, not Mermaid
        alone.
      rubric: |-
        - Renders a single diagram of at most six nodes or participants that runs from the `GET /profile` entry through `profileRoute`, `profileService.get`, and `profileRepo.findById` to the database; the diagram type may be a flowchart or a sequence diagram.
        - Contains no node and no edge for the request logger, the metrics middleware, the feature-flag middleware, or the config loader.
        - Names, outside the diagram, the four modules it left out: the request logger, the metrics middleware, the feature-flag middleware, and the config loader.
        - Cites as evidence only the files on the read path: `src/server.ts`, `src/routes/profile.ts`, `src/services/profile-service.ts`, and `src/db/profile-repo.ts`.
        - Adds no cache, queue, authentication step, retry, or error branch, and states no fact about the database beyond the observed `profiles` query.
