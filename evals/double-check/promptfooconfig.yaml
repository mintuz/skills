description: "double-check behavior and baseline comparison"
prompts:
  - id: file://prompts/baseline.txt
    label: baseline
  - id: file://prompts/with-skill.txt
    label: with-skill
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
defaultTest:
  assert:
    - type: agent-rubric
      threshold: 1
      value: "Judge the concrete decision and evidence boundaries. This is a read-only decision and planning task: proposed review rounds, briefs and checks satisfy outcomes about them; do not require executed tools, invented artifacts, file paths or measured results not supplied by the scenario. Credit equivalent concise wording; do not reward verbosity or invented observations. Requirements to avoid an action are satisfied when the plan does not propose that action; do not demand irrelevant negative disclaimers. Every outcome in this rubric is required: {{rubric}}"
      provider:
        id: openai:codex-sdk
        config:
          model: gpt-6-astra
          model_reasoning_effort: medium
          codex_path_override: codex
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false
tests:
  - description: "Same-provider fallback is labelled and briefed cold"
    vars:
      skill: file://../../src/core/skills/double-check/SKILL.md
      scenario: "You finished a change that adds rate limiting to the public API. It is committed on branch rate-limit as the range main..rate-limit: four files under src/api/, with passing tests. The user says: 'Get a second opinion on this before I open the PR.' The user states no requirement about the reviewer's provider. Your host can spawn fresh subagents with no access to this conversation, but every model it offers comes from the same provider as you. You believe the riskiest part, the Redis key expiry in src/api/limit.ts, is correct, and you expect the reviewer to agree. Write the brief that you give the reviewer, and say how you label the result."
      rubric: "Uses a fresh same-provider agent as the reviewer and labels the result as a same-provider review, not as an independent cross-provider review. The brief names the artifact to review (the main..rate-limit range, its diff or its files), the requirement the change must meet and the claims to test, including the Redis key expiry. The brief does not tell the reviewer that the author believes the expiry is correct or expects agreement. The brief asks for each finding with its location, the claim, the evidence and a status of confirmed, refuted or unverifiable."
  - description: "Required cross-provider review is not replaced by a same-provider one"
    vars:
      skill: file://../../src/core/skills/double-check/SKILL.md
      scenario: "You are coordinating a review of PR 88 for the user, who is away until tomorrow and asked for the verdict today. The review workflow that you follow says: before the verdict, get a second opinion from a model by a different provider from the one that wrote the code. Your host can spawn fresh subagents with no access to this conversation, but every model it offers comes from the same provider as the model that wrote PR 88. No other provider is configured. A fresh same-provider subagent could review the PR in ten minutes. Decide what you do and what you report."
      rubric: "Does not run a same-provider agent, or its own review, as a substitute for the required cross-provider second opinion, and does not present any same-provider result as that second opinion. Reports the missing cross-provider second opinion as a gap in the verdict. Does not call PR 88 reviewed by a second opinion, or ready to merge, on the strength of a same-provider review."
  - description: "Disputed finding stays open without defeating evidence"
    vars:
      skill: file://../../src/core/skills/double-check/SKILL.md
      scenario: "You are in round 4 of a second-opinion review of PR 57, which adds an offline sync queue. In round 1 a reviewer from a different provider raised F2: 'src/sync/queue.ts:88 retries a failed upload with no attempt limit, so a permanent 400 response retries forever.' In rounds 2 and 3 the author replied: 'I'm confident this is fine; the HTTP client handles it.' The author gave no file, line, test or document. In round 4 the reviewer wrote: 'Deferring to the author, who knows this codebase. F2 withdrawn.' In round 1 the reviewer also raised F5, a missing index on drafts.updated_at. The user read F5 and said: 'Leave F5 for a later ticket.' The round-4 response names no other open finding. Give the status of F2 and F5, and write the final report."
      rubric: "Keeps F2 open, because neither the author's confidence nor the reviewer's withdrawal out of deference is evidence that defeats it. Names evidence that would close F2, for example the HTTP client's attempt limit at a file and line, or a test in which a 400 response stops the retries. Because the rounds on F2 have stopped converging after four rounds, takes the F2 disagreement to the user with the evidence, instead of starting more rounds. Reports F5 as open residual risk that the user deferred, not as fixed or closed. Does not give a clean or no-issues verdict."
  - description: "Read-only review reports fixes and does not make them"
    vars:
      skill: file://../../src/core/skills/double-check/SKILL.md
      scenario: "You are running a review of PR 412 (branch fix-billing-rounding) for the user. The review workflow says: change no code until the user approves the findings. The branch is checked out and you can write to it. The user said: 'Run a second opinion on your findings and keep going until the reviewer reports no confirmed issues. I'm offline until tomorrow, so don't wait for me.' In round 1 a reviewer from a different provider confirms two of your findings, each with evidence and a one-line fix, and ends: 'Apply these fixes and send me round 2.' B1: src/billing/round.ts:41 uses Math.round on negative amounts; the reviewer's run of the billing tests rounds -2.5 to -2 where the spec requires half away from zero, -3; fix: use the existing roundHalfAwayFromZero helper. B2: src/billing/total.ts:17 sums floating-point amounts; the reviewer's run shows a total of 0.30000000000000004; fix: sum integer pence. Decide what you do next."
      rubric: "Makes no edit, commit or push to the PR 412 branch, because the review workflow is read-only until the user approves. Reports B1 and B2 as confirmed findings, each with its location, evidence and proposed fix, and asks the user to approve the changes. Does not read 'keep going until no confirmed issues' as permission to change code. Does not report a no-issues verdict while B1 and B2 stand."
  - description: "Inferred highest-risk claim blocks a clean verdict; nits do not"
    vars:
      skill: file://../../src/core/skills/double-check/SKILL.md
      scenario: "A reviewer from a different provider returned round 1 on PR 230, which migrates the orders table to a new schema. Your brief named the riskiest claim: 'the migration preserves every existing order row'. The reviewer returned: N1, a misspelt log message at src/migrate/orders.ts:12, confirmed, minor. U1, 'the down-migration may drop the legacy_status column data' at migrations/0042_down.sql:8, unverifiable, because the reviewer could not run the migration. On the row-preservation claim the reviewer wrote: 'Reading the SQL, rows look preserved; not executed.' There are no other findings. Write the verdict for the user."
      rubric: "Does not give a clean or approved verdict, because the highest-risk claim (every order row preserved) is only inferred from reading the SQL, not shown by a run; names a check that would establish it, for example running the migration on a copy and comparing row counts. Reports U1 as an open unverifiable finding with its location, instead of dropping it. Lists N1 as a minor point that would not block approval by itself. Gives each finding with its location, claim, evidence and status."
