description: "principle-define-done activation and exclusion"
prompts:
  - id: file://prompts/trigger.txt
    label: trigger
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  - description: Selects relevant guidance
    vars:
      request: "The user asked: 'Clean up our onboarding docs — they're a mess.' The docs folder has 14 pages. New hires report that the setup steps on 3 of them fail on Apple Silicon Macs, and two pages contradict each other about the Node version (one says 18, one says 20; package.json engines requires 20). Plan the work."
    assert:
      - type: skill-used
        value: principle-define-done
  - description: "Excludes a plain factual question"
    vars:
      request: "What does HTTP status code 429 mean?"
    assert:
      - type: not-skill-used
        value: principle-define-done
