description: "principle-fix-root-causes activation and exclusion"
prompts:
  - id: file://prompts/trigger.txt
    label: trigger
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  - description: Selects relevant guidance
    vars:
      request: "A service fails after restart. Clearing its state file on a disposable fixture lets it start, but user data lives in the production state file. The request is diagnosis only. A nil guard also prevents a separate documented empty-input crash. Give next steps."
    assert:
      - type: skill-used
        value: principle-fix-root-causes
  - description: Excludes a plain translation
    vars:
      request: "Translate only this sentence into French: The green notebook is on the table."
    assert:
      - type: not-skill-used
        value: principle-fix-root-causes
