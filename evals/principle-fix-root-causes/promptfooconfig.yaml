description: "principle-fix-root-causes behavior and baseline comparison"
prompts:
  - id: file://prompts/baseline.txt
    label: baseline
  - id: file://prompts/with-skill.txt
    label: with-skill
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
defaultTest:
  assert:
    - type: agent-rubric
      threshold: 1
      value: "Judge the concrete decision and evidence boundaries. This is a read-only decision and planning task: proposed verification and reproduction steps satisfy outcomes about checks; do not require executed tools, invented artifacts, file paths or measured results not supplied by the scenario. Credit equivalent concise wording; do not reward verbosity or invented observations. Requirements to preserve scope or avoid an action are satisfied when the plan does not propose violating them; do not demand irrelevant negative disclaimers. Every outcome in this rubric is required: {{rubric}}"
      provider:
        id: openai:codex-sdk
        config:
          model: gpt-6-astra
          model_reasoning_effort: medium
          codex_path_override: codex
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false
tests:
  - description: "A restart symptom does not authorize deleting data"
    vars:
      skill: file://../../src/principle/skills/principle-fix-root-causes/SKILL.md
      scenario: "A service fails after restart. Clearing its state file on a disposable fixture lets it start, but user data lives in the production state file. The request is diagnosis only. A nil guard also prevents a separate documented empty-input crash. Give next steps."
      rubric: "Treats stale or incompatible state as a hypothesis supported but not proved by fixture clearing; preserves production data and diagnosis-only scope; inspects state/version and discriminates failure causes; retains the legitimate empty-input guard; avoids sweeping all similar code into an unauthorized fix."
  - description: "Repair the shared owner and prove it"
    vars:
      skill: file://../../src/principle/skills/principle-fix-root-causes/SKILL.md
      scenario: "Two save entry points intermittently duplicate records. A reproducible trace shows both insert after reading the same absent key. Code edits are authorized. Propose the narrow root fix and verification."
      rubric: "Uses the supplied race evidence to repair atomic uniqueness/idempotency at the shared write owner rather than adding button-only delays; covers both callers and concurrent attempts with a regression that exposes the race; verifies existing legitimate behavior; does not claim tests ran."
