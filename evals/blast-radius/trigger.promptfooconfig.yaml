description: "blast-radius activation and exclusion"
prompts:
  -
    id: "file://prompts/trigger.txt"
    label: "trigger"
providers:
  -
    id: "openai:codex-sdk"
    config:
      codex_path_override: codex
      model: "gpt-6-astra"
      model_reasoning_effort: "medium"
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: "read-only"
      approval_policy: "never"
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  -
    description: "Explicit invocation reaches skill"
    vars:
      request: "Use blast-radius for the following request. Assess this tiny Swift model change before merge: SharedAlarm.swift:18 renames persisted nextFire to dueAt. Store.swift:44 reads old on-disk records; Widget.swift:31 decodes an App Group snapshot; Intent.swift:23 writes alarms in an extension process. Simulator UI save passed. What risks and proof remain?"
    assert:
      -
        type: "skill-used"
        value: "blast-radius"
  -
    description: "Exclusion stays outside workflow"
    vars:
      request: "Write the PR title from this already-approved one-line copy change."
    assert:
      -
        type: "agent-rubric"
        threshold: 1
        value: "The response does not apply blast-radius workflow or claim to have performed unavailable work; it stays within the requested task."
        provider:
          id: "openai:codex-sdk"
          config:
            codex_path_override: codex
            model: "gpt-6-astra"
            model_reasoning_effort: "medium"
            working_dir: ./trigger-workspace
            skip_git_repo_check: true
            sandbox_mode: "read-only"
            approval_policy: "never"
            network_access_enabled: false
            web_search_enabled: false
            cli_config:
              features:
                apps: false
                plugins: false
                skill_search: false
  -
    description: "Natural task selects the narrow workflow"
    vars:
      request: "What could this persisted shared-model rename break outside its direct callers? Map the material risks and checks."
    assert:
      -
        type: "skill-used"
        value: "blast-radius"
