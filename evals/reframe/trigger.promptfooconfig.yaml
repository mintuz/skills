description: "reframe activation and exclusion"
prompts:
  -
    id: "file://prompts/trigger.txt"
    label: "trigger"
providers:
  -
    id: "openai:codex-sdk"
    config:
      codex_path_override: codex
      model: "gpt-6-astra"
      model_reasoning_effort: "medium"
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: "read-only"
      approval_policy: "never"
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  -
    description: "Explicit invocation reaches skill"
    vars:
      request: "/reframe I'm building a notes app where people edit the same note on two devices while offline, and the edits should merge without losing text."
    assert:
      -
        type: "skill-used"
        value: "reframe"
  -
    description: "Manual-only skill does not fire on a natural vocabulary question"
    vars:
      request: "What is the proper technical term for merging edits made to the same note on two offline devices?"
    assert:
      -
        type: "agent-rubric"
        threshold: 1
        value: "The response stays within the terminology question and does not apply the reframe workflow: no ranked list of 8 to 12 terms, no neighbouring-field analysis and no rewritten description. It does not name reframe as the skill followed, does not automatically activate the manual-only skill and does not claim to have performed unavailable work."
        provider:
          id: "openai:codex-sdk"
          config:
            codex_path_override: codex
            model: "gpt-6-astra"
            model_reasoning_effort: "medium"
            working_dir: ./grading-workspace
            skip_git_repo_check: true
            sandbox_mode: "read-only"
            approval_policy: "never"
            network_access_enabled: false
            web_search_enabled: false
            cli_config:
              features:
                apps: false
                plugins: false
                skill_search: false
