description: "principle-preserve-unrelated-work activation and exclusion"
prompts:
  - id: file://prompts/trigger.txt
    label: trigger
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  - description: Selects relevant guidance
    vars:
      request: "You are asked to fix an off-by-one bug in `src/auth/session.ts` and commit the fix. `git status` shows uncommitted changes you did not make: an edited `config/app.yaml` and an unrelated half-finished function in the same file. Give the exact git steps to commit the fix."
    assert:
      - type: skill-used
        value: principle-preserve-unrelated-work
  - description: Excludes a plain translation
    vars:
      request: "Translate only this sentence into French: The green notebook is on the table."
    assert:
      - type: not-skill-used
        value: principle-preserve-unrelated-work
