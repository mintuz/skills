description: "principle-laziness-protocol activation and exclusion"
prompts:
  - id: file://prompts/trigger.txt
    label: trigger
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  - description: Selects relevant guidance
    vars:
      request: "A bug fix can remove six lines but silently drops cancellation support, or change twenty lines preserving cancellation with a required regression test. The user wants the smallest correct fix and repository rules require that test. Choose and justify."
    assert:
      - type: skill-used
        value: principle-laziness-protocol
  - description: Excludes a plain translation
    vars:
      request: "Translate only this sentence into French: The green notebook is on the table."
    assert:
      - type: not-skill-used
        value: principle-laziness-protocol
