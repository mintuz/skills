description: "principle-laziness-protocol behavior and baseline comparison"
prompts:
  - id: file://prompts/baseline.txt
    label: baseline
  - id: file://prompts/with-skill.txt
    label: with-skill
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
defaultTest:
  assert:
    - type: agent-rubric
      threshold: 1
      value: "Judge the concrete decision and evidence boundaries. This is a read-only decision and planning task: proposed verification and reproduction steps satisfy outcomes about checks; do not require executed tools, invented artifacts, file paths or measured results not supplied by the scenario. Credit equivalent concise wording; do not reward verbosity or invented observations. Requirements to preserve scope or avoid an action are satisfied when the plan does not propose violating them; do not demand irrelevant negative disclaimers. Every outcome in this rubric is required: {{rubric}}"
      provider:
        id: openai:codex-sdk
        config:
          model: gpt-6-astra
          model_reasoning_effort: medium
          codex_path_override: codex
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false
tests:
  - description: "Smallest diff still honors the outcome"
    vars:
      skill: file://../../src/principle/skills/principle-laziness-protocol/SKILL.md
      scenario: "A bug fix can remove six lines but silently drops cancellation support, or change twenty lines preserving cancellation with a required regression test. The user wants the smallest correct fix and repository rules require that test. Choose and justify."
      rubric: "Chooses the smallest change satisfying supported cancellation and required test, not raw minimum line count; rejects skipping tests as laziness; avoids unrelated cleanup or abstractions; verifies the accepted outcome and existing guarantees."
  - description: "One decision owner beats plumbing"
    vars:
      skill: file://../../src/principle/skills/principle-laziness-protocol/SKILL.md
      scenario: "Three callers recompute the same feature eligibility differently. A shared existing domain function already returns the correct decision, but a proposal threads five new flags through all layers. Recommend the focused change."
      rubric: "Reuses the existing eligibility owner and passes its result only where needed; preserves caller-specific behavior where intentional; avoids new abstraction layers or unnecessary flag plumbing; checks representative allowed/denied cases and scopes the diff to the defect."
