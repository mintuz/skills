description: "principle-reuse-before-building activation and exclusion"
prompts:
  - id: file://prompts/trigger.txt
    label: trigger
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  - description: "Selects guidance before writing new code"
    vars:
      request: "I'm about to write a new date-formatting helper for our invoice emails. The codebase is large and I haven't checked what already exists. How should I approach it?"
    assert:
      - type: skill-used
        value: principle-reuse-before-building
  - description: "Leaves a pure redundancy-removal task to its owner"
    vars:
      request: "Our service has two validators and a retry queue that nobody calls any more. Before I add a new rate-limiter, remove whatever is provably dead and judge whether the limiter is still needed."
    assert:
      - type: not-skill-used
        value: principle-reuse-before-building
