# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: React skill versus no-skill baseline

prompts:
  - id: file://prompts/baseline.txt
    label: baseline
  - id: file://prompts/with-skill.txt
    label: with-skill

providers:
  - id: openai:codex-sdk
    config:
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false

evaluateOptions:
  repeat: 3

defaultTest:
  assert:
    - type: agent-rubric
      metric: rubric
      threshold: 1
      value: |-
        Judge only whether the React response reaches every observable outcome
        required by this scenario. Give equal weight to every outcome below.
        Credit concrete, runnable logic and explicit boundary reasoning rather
        than copied rubric wording, verbosity, or invented project facts.

        {{rubric}}
      provider:
        id: openai:codex-sdk
        config:
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false

tests:
  - description: Keep authorization at the server boundary despite a client permission gate
    vars:
      skill: file://../../src/web/skills/react/SKILL.md
      scenario: |-
        Implement the smallest React and TypeScript change for a comment delete
        action. `currentUser` is `User | null`; a `User` has `id` and role
        `"admin" | "member"`; a `Comment` has `id` and `authorId`.
        `deleteComment(comment.id)` calls an existing HTTP endpoint and rejects
        with `ApiError { status: number }`. Product wants the Delete button shown
        only to the comment author or an admin. The endpoint currently deletes by
        comment ID without checking the authenticated actor. You may edit only
        the frontend repository in this task.

        Return the component-side implementation and a short security rationale.
        Be precise about what this task can and cannot make secure. Do not invent
        a dependency, backend implementation, or new application-wide state.
      rubric: |-
        - States that a hidden or disabled React control is only a UX permission gate and cannot authorize the delete request; it does not claim this frontend-only task makes deletion secure.
        - Names the required server contract: authenticate the actor and authorize admin-or-resource-owner access before deleting, returning 403 with no deletion when unauthorized.
        - Implements one small, typed owner-or-admin predicate that is false for `currentUser === null`, and renders an accessible `button` only when that predicate passes.
        - Calls the existing `deleteComment(comment.id)` directly from the user event and handles a rejected 403 locally as a non-success state; it does not redirect globally, log out the user, or treat a client role as proof of authority.
        - Adds no dependency, duplicated permission store, effect-driven mutation, backend code, or claim that client validation prevents a crafted HTTP request.

  - description: Prevent stale async effect results after identity change and unmount
    vars:
      skill: file://../../src/web/skills/react/SKILL.md
      scenario: |-
        Patch this React component. The repository has no data-fetching library,
        and dependencies cannot change. `loadUser(userId, signal)` rejects with a
        DOM `AbortError` when cancelled.

        ```tsx
        type Props = {
          userId: string;
          loadUser: (userId: string, signal: AbortSignal) => Promise<User>;
        };

        function UserPanel({ userId, loadUser }: Props) {
          const [state, setState] = useState<State>({ status: "loading" });

          useEffect(() => {
            setState({ status: "loading" });
            loadUser(userId, new AbortController().signal).then(
              (user) => setState({ status: "success", user }),
              (error) => setState({ status: "error", error }),
            );
          }, [userId, loadUser]);

          return <UserState state={state} />;
        }
        ```

        When `userId` changes from A to B, request B may settle before request A;
        A must never replace B. Unmount must cancel outstanding work. React
        Strict Mode's development setup-cleanup-setup cycle must not produce an
        error state. Return the smallest component patch and a concise rationale.
      rubric: |-
        - Creates one `AbortController` inside each effect setup and passes that controller's signal to `loadUser`.
        - Returns cleanup that prevents that setup's later settlements from writing state and aborts its controller, so prop changes, unmount, and Strict Mode cleanup invalidate that setup.
        - Guards both fulfillment and rejection state writes so an invalidated setup never writes, ensuring request A cannot replace request B even if it settles late.
        - Treats an `AbortError` as cancellation rather than an application error and leaves it out of the rendered error state.
        - Keeps `userId` and `loadUser` as honest dependencies and adds no data-fetching dependency or global state.

  - description: Synchronise an imperative editor from the current prop, not from a transition
    vars:
      skill: file://../../src/web/skills/react/SKILL.md
      scenario: |-
        Fix this React component. `editor` is an imperative code-editor handle
        that the parent creates; `editor.layout(width)` re-measures the editor
        to `width` pixels and is cheap and idempotent. The parent toggles
        `collapsed` when the user clicks the sidebar button. Bug report: when the
        page loads with `collapsed` already `false`, the editor renders at the
        wrong width until the user collapses and expands the sidebar once.
        Dependencies cannot change and the parent cannot change. Return the
        smallest patch and explain why the original effect was wrong.

        ```tsx
        type Props = { collapsed: boolean; editor: EditorHandle };

        function EditorFrame({ collapsed, editor }: Props) {
          const frameRef = useRef<HTMLDivElement>(null);
          const wasCollapsed = useRef(collapsed);

          useEffect(() => {
            // Only relayout when the sidebar expands; the editor lays itself out on mount.
            if (wasCollapsed.current && !collapsed) {
              editor.layout(frameRef.current!.clientWidth);
            }
            wasCollapsed.current = collapsed;
          }, [collapsed, editor]);

          return (
            <div ref={frameRef} className={collapsed ? "frame frame--narrow" : "frame frame--wide"}>
              <EditorView editor={editor} />
            </div>
          );
        }
        ```
      rubric: |-
        - Removes the previous-value comparison (`wasCollapsed`) so the effect calls `editor.layout` with the frame's current width on every run, including the first run after mount.
        - Applies the layout for both values of `collapsed` (collapse and expand), not only on the expand transition.
        - Keeps one effect for this synchronisation; it does not add a separate mount-only (`[]`) effect beside the transition guard and does not move the `layout` call into a click handler.
        - Keeps `collapsed` and `editor` as dependencies and adds no state copy of `collapsed`, no dependency, and no change to the parent component.
        - Explains the defect as an effect that reacted to a transition instead of synchronising the editor with the current value; it does not claim to have run or tested the code.

  - description: Resolve a cross-feature import against the boundary rules
    vars:
      skill: file://../../src/web/skills/react/SKILL.md
      scenario: |-
        The project uses `src/features/<name>` modules with an ESLint boundary
        rule that forbids any import from another feature folder, including
        that feature's `index.ts`. `features/orders` now needs the
        `CustomerBadge` component that lives in
        `features/customers/components/customer-badge.tsx`. The badge calls the
        `useCustomer(customerId)` hook from
        `features/customers/api/get-customer.ts` itself.
        `features/customers/components/customer-panel.tsx` renders
        `<CustomerBadge customerId={customer.id} />` today and must keep
        working. The order response
        from `features/orders/api/get-order.ts` already includes
        `customer: { id: string; name: string }`. A teammate proposes
        disabling the lint rule for that one import. Return the placement
        decision with its reason, the resulting file moves, what stays
        feature-local, how `features/orders` obtains the customer data it
        gives to the badge, and how `features/customers` keeps feeding the
        badge. Do not write the component code.
      rubric: |-
        - Rejects disabling the boundary rule and leaves no import from `features/customers` (including its `index.ts`) inside `features/orders`.
        - Moves `CustomerBadge` to `src/components/` because two features now use it, and states that criterion.
        - Keeps `useCustomer` and `get-customer.ts` inside `features/customers/api`; has the shared badge receive its customer data through props rather than importing a feature API from the shared layer; and keeps `customer-panel.tsx` working by having a customers-owned component (the panel itself or a feature-local wrapper) call `useCustomer` and pass its result to the shared badge.
        - Has `features/orders` pass the `customer` data from its own order response to the shared badge (or composes the two features in an app-level page), without creating a new feature folder.
        - Creates no shared API module, no new feature folder, and no dependency.

  - description: Remove effect-driven derived state and event-driven work
    vars:
      skill: file://../../src/web/skills/react/SKILL.md
      scenario: |-
        Patch this React component. `items` is a prop; `search` is local state.
        Return the smallest change and the reason for each removed effect.

        ```tsx
        function Inventory({ items, onExport }: Props) {
          const [search, setSearch] = useState("");
          const [visible, setVisible] = useState(items);
          const [exportRequested, setExportRequested] = useState(false);

          useEffect(() => {
            setVisible(items.filter((i) => i.name.includes(search)));
          }, [items, search]);

          useEffect(() => {
            if (exportRequested) {
              onExport(visible);
              setExportRequested(false);
            }
          }, [exportRequested, visible, onExport]);

          return (
            <>
              <input value={search} onChange={(e) => setSearch(e.target.value)} />
              <button onClick={() => setExportRequested(true)}>Export</button>
              <List items={visible} />
            </>
          );
        }
        ```
      rubric: |-
        - Removes the `visible` state and its effect, and computes the filtered list during render (a plain expression or `useMemo`).
        - Removes the `exportRequested` state and its effect, and calls `onExport` with the computed list directly in the button's click handler.
        - Gives the reason for each removal: the first effect only derived a value from `items` and `search`, and the second only did work that the click caused.
        - Keeps `search` as the only local state and preserves the rendered input, button, and list.
        - Adds no dependency, context, or reducer, and does not claim to have run or tested the code.

  - description: Put filter and pagination state in the URL, not a global store
    vars:
      skill: file://../../src/web/skills/react/SKILL.md
      scenario: |-
        A product list page has a status filter, a search term, and a page
        number. A teammate proposes a Zustand store for all three so the values
        survive navigation and can be shared as links. Zustand is not installed.
        The app already uses React Router and React Query, and the product list
        comes from `fetchProducts({ status, search, page })`. Return the state
        placement decision for each value with the smallest implementation
        sketch, and say what the proposal gets wrong. Add no dependency.
      rubric: |-
        - Places the status filter, search term, and page number in URL search params through React Router, and rejects the global store for them.
        - Keeps the product list in React Query, passes the three parsed URL values to `fetchProducts`, and includes the same three values in the query key, rather than copying the list into any store.
        - Shows the component reading and updating the search params directly, without a duplicate `useState` copy that must be kept in sync with the URL.
        - States that a global store would not give shareable links or back-button behaviour that the URL gives for free.
        - Adds no Zustand or other dependency and no application-wide state.

  - description: Repair the whole permission path when hiding an action from some roles
    vars:
      skill: file://../../src/web/skills/react/SKILL.md
      scenario: |-
        Only owners and admins should be able to invite people. Today every team
        member sees the invite form on the members page; hide it from everyone
        else. The API already refuses an invite from anyone who is not an owner
        or admin. Installed: React 19.2, React Router 7 (data routes with
        loaders), XState 5, `@xstate/react` 6 and Vitest. Zod, axios and query
        libraries are not installed; add no dependency. Return every changed or
        new file as code, including tests for the permission rule, and a short
        handover. The complete relevant source follows.

        ```ts
        // src/types/user.ts
        export const roles = ["owner", "admin", "member"] as const;
        export type Role = (typeof roles)[number];
        export type CurrentUser = Readonly<{ id: string; name: string; teamId: string; role: Role }>;
        export function parseRole(value: unknown): Role | null {
          return roles.find((role) => role === value) ?? null;
        }

        // src/lib/current-user.ts (the root route loader)
        import { http } from "@/lib/http";
        import type { CurrentUser } from "@/types/user";
        export async function getCurrentUser(): Promise<CurrentUser> {
          return (await http("/api/me")) as CurrentUser;
        }

        // src/lib/http.ts
        import { signOut } from "@/lib/sign-out"; // clears the session and assigns /login
        export class HttpError extends Error {
          readonly status: number;
          constructor(status: number) {
            super(`The request failed with status ${status}`);
            this.name = "HttpError";
            this.status = status;
          }
        }
        export async function http(path: string, init?: RequestInit): Promise<unknown> {
          const response = await fetch(path, init);
          if (response.status === 401 || response.status === 403) {
            signOut();
          }
          if (!response.ok) throw new HttpError(response.status);
          return response.json();
        }

        // src/features/invites/api/send-invite.ts
        import { http } from "@/lib/http";
        export async function sendInvite(email: string): Promise<void> {
          await http("/api/invites", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
        }
        ```

        ```tsx
        // src/app/members-page.tsx
        export function MembersPage() {
          const members = useLoaderData<typeof getMembers>();
          const user = useCurrentUser(); // reads the root loader's CurrentUser
          return (
            <>
              <h1>Members</h1>
              <MemberList members={members} teamId={user.teamId} />
              <InviteForm />
            </>
          );
        }

        // src/features/invites/components/invite-form.tsx (unchanged so far)
        export function InviteForm() {
          const [email, setEmail] = useState("");
          const actorRef = useActorRef(inviteMachine, { input: { sendInvite } });
          const sending = useSelector(actorRef, (s) => s.matches("sending"));
          const sent = useSelector(actorRef, (s) => s.matches("sent"));
          const error = useSelector(actorRef, (s) => (s.matches("failed") ? s.context.error : null));
          // submit sends { type: "SEND", email } to the actor; the machine invokes
          // sendInvite and moves to "failed" with the error message on rejection.
          return (
            <form aria-label="Invite someone" onSubmit={(e) => { e.preventDefault(); actorRef.send({ type: "SEND", email }); }}>
              <label>Email<input type="email" value={email} onChange={(e) => setEmail(e.target.value)} /></label>
              <Button type="submit" disabled={sending}>Invite</Button>
              {sent && <p role="status">Invite sent</p>}
              {error && <p role="alert">{error}</p>}
            </form>
          );
        }
        ```
      rubric: |-
        - Adds a plain exported permission function outside any component (for example `canInvite(user)`) that allows owner and admin and denies member and an unknown role, and `MembersPage` calls that same function to decide whether to render `<InviteForm />`.
        - Adds Vitest tests that call that production function directly without rendering React and assert owner and admin allowed, member denied, and an explicit unknown role denied.
        - Keeps an unknown role as an explicit value distinct from owner, admin and member (for example `null` or `"unknown"`) that grants nothing; it does not map an unknown role to member or keep trusting the response through an `as CurrentUser` cast.
        - Replaces the cast in `getCurrentUser` with a parser that validates the `unknown` response body, including the role, before returning a `CurrentUser`.
        - Changes `http` so a 403 no longer signs out, clears the session or redirects, while a 401 still signs out and every non-ok status still throws `HttpError`; the refused invite reaches the existing invite machine and shows in the form's alert, with the machine and form wiring kept.
        - States in the handover that hiding the form only controls what the page shows and that the server must refuse unauthorised invites itself.

  - description: Deliver the newest callback from a subscription without reconnecting
    vars:
      skill: file://../../src/web/skills/react/SKILL.md
      scenario: |-
        Bug report: our presence server shows the members page opening a new
        connection every time anything on the page re-renders, for example when
        you page through the list. Fix it in the shared hook
        `src/hooks/use-presence-notifications.ts`. React 19.2 is installed; add
        no dependency. `presenceClient.subscribe(teamId, listener)` opens one
        connection and returns an unsubscribe function. Return the patch and
        explain the cause and the fix.

        ```ts
        // src/hooks/use-presence-notifications.ts
        import { useEffect } from "react";
        import { presenceClient } from "@/lib/presence-client";

        // Calls onCameOnline with a member's id whenever a member of the team comes online.
        export function usePresenceNotifications(
          teamId: string,
          onCameOnline: (memberId: string) => void,
        ): void {
          useEffect(() => presenceClient.subscribe(teamId, onCameOnline), [teamId, onCameOnline]);
        }
        ```

        ```tsx
        // src/features/members/components/member-list.tsx (caller, excerpt)
        export function MemberList({ members, teamId }: MemberListProps) {
          const [page, setPage] = useState(1);
          usePresenceNotifications(teamId, (memberId) => {
            const member = members.find(({ id }) => id === memberId);
            if (member) notify(`${member.name} is online`);
          });
          // ...renders the current page of member cards and Previous/Next buttons
        }
        ```
      rubric: |-
        - Wraps the callback in React's `useEffectEvent` inside the hook and calls that Effect Event only from the listener that the subscription Effect creates.
        - Keeps `teamId` as the Effect's dependency, so a team change unsubscribes and resubscribes and unmount unsubscribes; removes the callback from the dependency list and does not list the Effect Event as a dependency or pass it to another hook or component.
        - Uses no latest-callback ref or `useLatest`-style workaround and does not wrap the caller's callback in `useCallback`; the fix stays in the shared hook and `MemberList` is unchanged.
        - After a re-render supplies a different callback, the next notification reaches the newest callback without opening a new connection.
        - Explains the cause (a new inline callback each render is an Effect dependency, so every render tears down and reopens the subscription) and does not claim the Effect Event's identity is stable.

  - description: Share markup between features through a props-only component, not a mode flag
    vars:
      skill: file://../../src/web/skills/react/SKILL.md
      scenario: |-
        On the billing page, the seat summary should list who holds each seat:
        their avatar and name, like the cards on the members page but without the
        email, the role badge or the role menu. The seats response already
        includes the holders. Features live in `src/features/<name>`, shared code
        in `src/components/`, and an ESLint rule forbids importing from another
        feature. Add no dependency. Return every changed or new file as code and
        a short handover. The complete relevant source follows.

        ```tsx
        // src/components/avatar.tsx: export function Avatar({ src }: { src: string }) renders a decorative <img alt="">
        // src/components/card.tsx: exports Card, CardHeader and CardBody, each rendering its children

        // src/features/members/components/member-card.tsx
        export function MemberCard({ member }: Readonly<{ member: Member }>) {
          return (
            <Card>
              <CardHeader>
                <Avatar src={member.avatarUrl} />
                <h3>{member.name}</h3>
              </CardHeader>
              <CardBody>
                <p>{member.email}</p>
                <RoleBadge role={member.role} />
                <MemberActions member={member} />
              </CardBody>
            </Card>
          );
        }

        // src/features/billing/api/get-seat-usage.ts (types; the fetcher already parses them)
        export type SeatHolder = Readonly<{ id: string; name: string; avatarUrl: string }>;
        export type SeatUsage = Readonly<{ used: number; limit: number; holders: readonly SeatHolder[] }>;

        // src/features/billing/components/seat-summary.tsx
        export function SeatSummary({ usage }: Readonly<{ usage: SeatUsage }>) {
          return (
            <Card>
              <CardHeader><h2>Seats</h2></CardHeader>
              <CardBody><p>{usage.used} of {usage.limit} seats used</p></CardBody>
            </Card>
          );
        }
        ```
      rubric: |-
        - Extracts the avatar-and-name markup into one props-only presentational component in `src/components/` that imports no feature code, calls no feature hook and fetches nothing, and renders it from both `MemberCard` and `SeatSummary`.
        - `SeatSummary` lists every holder from `usage.holders`, keyed by id, with avatar and name only, and does not fetch holders again.
        - Billing imports nothing from `features/members` or any other feature, and the change adds no re-export barrel and no new feature folder.
        - Adds no mode, variant or boolean prop (such as `compact`) to `MemberCard`; `MemberCard` keeps its email, `RoleBadge` and `MemberActions`.
        - Does not count rebuilding the avatar-and-name markup inside billing from `Card` and `Avatar` as sharing it, and adds no dependency.

  - description: Replace mode booleans with explicit variant components built from shared parts
    vars:
      skill: file://../../src/web/skills/react/SKILL.md
      scenario: |-
        The settings page publishes a new notice with its audience, an attachment
        action and a Publish notice button. Another page edits an existing notice
        with Save changes and Cancel edit, but no audience or attachment action.
        Both need the same text field and frame. The caller already owns the text
        and the callbacks, and those callbacks must keep receiving the current
        text. We will add other pages with different controls later. Show the
        public API and complete TypeScript React code you recommend for these two
        pages, including how the shared pieces and the caller fit together. Keep
        the empty-text guard. Installed: React 19.2, React Router 7, XState 5;
        add no dependency. This is a proposal for review.

        ```tsx
        // src/features/notices/notice-editor.tsx
        type NoticeEditorProps = Readonly<{
          text: string;
          editing?: boolean;
          replying?: boolean;
          showAudience?: boolean;
          allowAttachments?: boolean;
          onTextChange: (text: string) => void;
          onCommit: (text: string) => void;
          onCancel: () => void;
          onAttach: () => void;
        }>;

        export function NoticeEditor({ text, editing = false, replying = false, showAudience = true,
          allowAttachments = true, onTextChange, onCommit, onCancel, onAttach }: NoticeEditorProps) {
          return (
            <section aria-label="Notice editor">
              <h2>{editing ? "Edit notice" : replying ? "Reply to notice" : "Publish notice"}</h2>
              {showAudience && <p>Everyone in the team</p>}
              <label>Notice text<textarea value={text} onChange={(event) => onTextChange(event.currentTarget.value)} /></label>
              <footer>
                {allowAttachments && <button type="button" onClick={onAttach}>Attach a file</button>}
                <button type="button" disabled={text.trim() === ""} onClick={() => onCommit(text)}>
                  {editing ? "Save changes" : replying ? "Send reply" : "Publish notice"}
                </button>
                {editing && <button type="button" onClick={onCancel}>Cancel edit</button>}
              </footer>
            </section>
          );
        }
        ```
      rubric: |-
        - Provides two distinctly named entry components (for example `PublishNoticeEditor` and `EditNoticeEditor`), each explicitly composing the shared frame, text field and its own controls.
        - The publishing entry shows the audience line and has the attachment and Publish notice controls; the editing entry has Save changes and Cancel edit and no audience or attachment controls.
        - The shared frame and text field take no mode booleans and no mode or variant discriminator and hide no layout switch; native attributes such as a button's `disabled` are not mode props.
        - Structure is composed with `children` rather than `renderHeader`/`renderFooter`/`renderActions` callbacks on one monolith.
        - Text stays caller-owned: the change callback receives edits, the commit callback receives the current text, and the commit button stays disabled for empty or whitespace-only text; shared controls have real event handlers, with no placeholder or no-op action and no new dependency.

  - description: Share one draft across separate parts through an injectable provider contract
    vars:
      skill: file://../../src/web/skills/react/SKILL.md
      scenario: |-
        A page needs a notice text field inside a form, a live preview in the
        neighbouring sidebar and a publish control in its toolbar. They must all
        use the same current notice text. A second editor on that page must stay
        independent. Some pages keep the text locally; others already receive the
        text and a change callback from their page owner. Show complete
        TypeScript React code for reusable parts that support both arrangements
        without rewriting the text field, preview or publish control, and include
        both page examples. The sidebar need not sit inside the visible form. Keep
        this synchronous: the publish callback hands the current text to the
        page; it does not manage a request. Installed: React 19.2, React Router 7,
        XState 5, `@xstate/react` 6; no Zustand, query or form library. Add no
        dependency. This is a proposal for review.

        ```tsx
        // src/features/notices/draft-parts.tsx (current)
        import { useEffect, useState } from "react";

        export function DraftField({ initialText, onDraftChange }: Readonly<{
          initialText: string;
          onDraftChange: (text: string) => void;
        }>) {
          const [text, setText] = useState(initialText);
          useEffect(() => onDraftChange(text), [text, onDraftChange]);
          return <label>Notice text<textarea value={text} onChange={(event) => setText(event.currentTarget.value)} /></label>;
        }

        export function DraftPreview({ initialText }: Readonly<{ initialText: string }>) {
          const [text] = useState(initialText);
          return <output aria-label="Notice preview">{text}</output>;
        }

        export function DraftPublish({ readText, onPublish }: Readonly<{
          readText: () => string;
          onPublish: (text: string) => void;
        }>) {
          return <button type="button" onClick={() => onPublish(readText())}>Publish notice</button>;
        }
        ```
      rubric: |-
        - Defines one typed context contract that separates the draft state from named actions (for example `changeText` and `publish`) and exposes no generic `update(updater)` or raw setter; the field, preview and publish control read only that contract from their own root's context.
        - Provides a local-state provider and a page-controlled provider that both supply the same contract, with complete page examples for each, and the field, preview and publish control are unchanged between them and import neither provider's implementation.
        - Each provider wraps the field, the sidebar preview and the toolbar publish control even though the preview is outside the form, and two mounted providers keep independent text with no module-level shared draft.
        - Editing updates the text the preview shows and the text that publish hands to the page, with no child-to-parent Effect synchronisation, no duplicated preview state and no ref read of another component's draft.
        - The code is complete and runnable, with a real publish callback rather than ellipses, stubs or a no-op, and adds no dependency.

  - description: Build a shareable filtered view from router state at click time
    vars:
      skill: file://../../src/web/skills/react/SKILL.md
      scenario: |-
        On the members page, add a filter by role (owner, admin, member or
        everyone) and a search box for names. Add a Copy link button too, so I
        can send someone exactly the view I am looking at, page included. The app
        renders under React Router 7's `RouterProvider` with
        `createBrowserRouter`; React 19.2 is installed and no query, store or form
        library is. Add no dependency. A member's `role` is
        `"owner" | "admin" | "member"`. Return the changed component as code and
        a short handover.

        ```tsx
        // src/features/members/components/member-list.tsx
        const pageSize = 10;

        export function MemberList({ members, teamId }: Readonly<{ members: readonly Member[]; teamId: string }>) {
          const [page, setPage] = useState(1);
          const pageCount = Math.max(1, Math.ceil(members.length / pageSize));
          const shown = members.slice((page - 1) * pageSize, page * pageSize);

          return (
            <section aria-label="Members">
              <ul>
                {shown.map((member) => (
                  <li key={member.id}><MemberCard member={member} /></li>
                ))}
              </ul>
              <nav aria-label="Pages">
                <Button onClick={() => setPage(page - 1)} disabled={page === 1}>Previous</Button>
                <span>Page {page} of {pageCount}</span>
                <Button onClick={() => setPage(page + 1)} disabled={page === pageCount}>Next</Button>
              </nav>
            </section>
          );
        }
        ```
      rubric: |-
        - Reads and writes role, name search and page through React Router search parameters (for example `useSearchParams`), removes the original `useState` page, and keeps no state copy or Effect that mirrors the URL.
        - Derives the filtered list and the current page during render from the parsed URL values, so reload and browser Back/Forward restore the view.
        - Treats an unknown role value as everyone and an invalid or out-of-range page as a valid page, rather than crashing or showing an empty list.
        - The Copy link handler builds the link inside the click handler from the router's current location or search parameters, not from `window.location`, and the link includes role, search and page.
        - Keeps rendering `MemberCard` for each shown member and the Previous/Next controls, and adds no dependency.
