# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: CSS skill versus no-skill baseline

prompts:
  - id: file://prompts/baseline.txt
    label: baseline
  - id: file://prompts/with-skill.txt
    label: with-skill

providers:
  - id: openai:codex-sdk
    config:
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false

defaultTest:
  assert:
    - type: agent-rubric
      metric: rubric
      threshold: 1
      value: |-
        Judge only whether the CSS response reaches every required outcome for
        this scenario. Give equal weight to every outcome below. Credit explicit,
        scenario-specific declarations and reasoning. Do not reward verbosity,
        copied rubric wording, or invented project facts.

        {{rubric}}
      provider:
        id: openai:codex-sdk
        config:
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false

tests:
  - description: Override an immutable third-party ID rule without a fake specificity fix
    vars:
      skill: file://../../src/web/skills/css/SKILL.md
      scenario: |-
        Supply the smallest production CSS patch that makes this checkout label
        `#0b57d0`, then explain why it wins. The vendor stylesheet is immutable,
        unlayered, and loads after the app stylesheet. HTML, load order, inline
        styles, and JavaScript cannot change. The app stylesheet is the only
        writable surface. Project policy: app styles never use ID selectors.

        ```html
        <section id="checkout">
          <button class="button checkout__submit">Pay now</button>
        </section>
        ```

        ```css
        /* app.css (loads first; writable) */
        .checkout__submit { color: #222; }

        /* vendor.css (loads second; immutable) */
        #checkout .button { color: #666; }
        ```
      rubric: |-
        - Gives a concrete app.css declaration that makes the supplied button color `#0b57d0` under the stated source order and immutable vendor boundary.
        - Uses one narrowly scoped `!important` declaration on `.checkout__submit`, because an author-important declaration beats the vendor's normal declaration while preserving the existing HTML and load order.
        - Treats this as an evidenced last-resort boundary exception: it does not build the fix on an ID selector chain such as `#checkout .button.checkout__submit` (that chain would win, but app styles must not depend on ID selectors), and adds no inline style, JavaScript, cascade layer, or markup change.

  - description: Keep a visually hidden skip link stateful and robust
    vars:
      skill: file://../../src/web/skills/css/SKILL.md
      scenario: |-
        Write the CSS for the existing skip link below. It must remain in the
        accessibility tree and keyboard order while visually hidden, become a
        clearly visible fixed control on keyboard focus, fit narrow viewports at
        400% zoom, and remain identifiable in Windows forced-colors mode. The
        component has no other states. Do not change the HTML.

        ```html
        <a class="u-skip-link" href="#main">Skip to content</a>
        ```
      rubric: |-
        - Hides the unfocused link with a one-pixel clipping technique while keeping it in the accessibility tree and tab order; it does not use `display: none`, `visibility: hidden`, zero-sized text, or off-screen coordinates.
        - Restores every hiding property on `.u-skip-link:focus` or `.u-skip-link:focus-visible` and makes the link fixed near the viewport edge with a visible foreground, background, and a focus indicator that is an `outline` or a border, not only a `box-shadow`.
        - Keeps the focused control inside a narrow viewport using positioning and a viewport-bounded width or wrapping rule, with scalable text and spacing suitable for 400% zoom.
        - Includes an explicit forced-colors treatment (for example a `@media (forced-colors: active)` rule using system colors) that keeps the focus indicator visible rather than relying only on author colors or shadows.
        - Models the utility as explicitly stateful: the base and focus rules form one contract, without `!important` declarations that force a second specificity contest between its own states.

  - description: Move spacing out of a reusable card component into its parent layouts
    vars:
      skill: file://../../src/web/skills/css/SKILL.md
      scenario: |-
        Supply the CSS change and explain the ownership rule. The `.card`
        component ships with `margin-bottom: 24px`. It appears in three places:
        a vertical `.card-list`, a three-column `.card-grid` where the bottom
        margin leaves a ragged edge under the last row, and a `.modal` where a
        single card sits directly above the modal footer and adds unwanted
        space. Product wants 24px between cards in the list and grid, and no
        space between the card and the modal footer. Spacing between cards
        must scale with the user's browser font-size preference; the root
        font-size is the browser default of 16px. The HTML cannot change.
        Only these rules exist.

        ```css
        .card { padding: 1rem; margin-bottom: 24px; border: 1px solid #ccc; border-radius: 8px; }
        .card-list { display: flex; flex-direction: column; }
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
        .modal { display: flex; flex-direction: column; }
        ```
      rubric: |-
        - Deletes the `margin-bottom` declaration from `.card` (does not keep it as `margin-bottom: 0`) so the component owns no space outside its own box.
        - Adds the 24px spacing to the parent layouts with `gap` (or an equivalent parent-owned rule) on `.card-list` and `.card-grid`.
        - Leaves `.modal` and `.card` padding, border, and radius unchanged, and does not use a `:last-child` margin reset or a modal-specific override as the primary fix.
        - Expresses the vertical gap in `rem` (1.5rem) because it should scale with user font preferences, and keeps `px` for the border and radius.
        - Explains that the parent context decides spacing, not the component, and adds no `!important`, ID selector, or rule the scenario did not supply.

  - description: Fix shorthand resets that wipe a background image and a font variant
    vars:
      skill: file://../../src/web/skills/css/SKILL.md
      scenario: |-
        Supply the patch and explain the cause. The `.hero` panel
        loses its background image whenever the `.hero--brand` modifier is
        applied, and the heading loses its small caps whenever the
        `.hero__title--compact` modifier is applied. The `--brand-tint` custom
        property is a valid colour. Only these rules are involved, and both
        modifiers appear after their base rules in the same stylesheet. The
        team wants the fix to stop the same class of bug for any other
        heading property, not only the two that are visible now.

        ```css
        .hero { background-image: url(hero.jpg); background-size: cover; }
        .hero--brand { background: var(--brand-tint); }
        .hero__title { font-size: 2rem; line-height: 1.2; font-variant: small-caps; }
        .hero__title--compact { font: 600 1.5rem/1.1 system-ui; }
        ```
      rubric: |-
        - Identifies that the `background` shorthand resets `background-image` to its initial value, and replaces it with `background-color: var(--brand-tint);`.
        - Identifies that the `font` shorthand resets `font-variant` (among other sub-properties it does not name), and rewrites the modifier as `font-weight`, `font-size`, `line-height`, and `font-family` longhands; it neither keeps a `font` shorthand (with or without `small-caps` inside it) nor re-declares `font-variant` after the shorthand, because both leave the modifier resetting sub-properties it does not name, which the scenario asks to prevent.
        - Keeps the modifier class names, selectors, and specificity unchanged, and adds no `!important`, ID selector, or rule reordering.
        - Attributes both losses to the shorthand setting unnamed sub-properties to their initial values, and does not attribute them to specificity, source order, or the custom property.
        - Does not invent properties, rules, or markup the scenario did not supply, and does not claim to have run or tested anything.

  - description: Plan a legacy stylesheet refactor without a rewrite or a deploy freeze
    vars:
      skill: file://../../src/web/skills/css/SKILL.md
      scenario: |-
        Produce a refactoring plan. Write no CSS. A 4,000-line legacy
        stylesheet is compiled from one partial per component (`_sidebar.scss`,
        `_buttons.scss`, `_promo.scss`, and others) plus a `_legacy.scss`
        bundle. It contains: (a) `#sidebar ul.nav li a`, used on every page;
        (b) a `.btn` rule overridden in eleven places with `!important`;
        (c) a `.promo-banner` used on one campaign page that ends next week;
        (d) an unknown amount of dead CSS that coverage tools cannot confirm
        because some pages are behind login and some selectors are only
        reached by user actions. The team cannot freeze deploys and will not
        accept a full rewrite. State the order of work, what to skip, how to
        isolate each rewrite, and where each fix lands.
      rubric: |-
        - Prioritises (a) and (b) because they are frequently used and problematic, and explicitly skips (c) because it ends next week.
        - Proposes a measurement step for (d) that works on production traffic (for example a per-selector beacon logged over weeks) before deleting anything, rather than deleting by inspection or by a one-off coverage run.
        - Replaces (a) with a flat class-based selector and describes building the replacement in isolation before reintegrating it.
        - Replaces the eleven reactive `!important` overrides on `.btn` by restructuring the cascade (source order, self-chaining, simpler selectors, or layers when every competing rule is layered), and routes any remaining legacy conflict into a dedicated, documented legacy-override file (such as `shame.css` or a clearly marked `_legacy.scss` entry) that is separate from the component partial and marked for later removal.
        - Keeps deploys unblocked by landing each fix in small increments in the component's own partial, does not propose a full rewrite, and writes no CSS.

  - description: Make article typography follow the reader's default text size
    vars:
      skill: file://../../src/web/skills/css/SKILL.md
      scenario: |-
        Customers who set a larger default text size in their browser say the
        article on the home page does not get bigger. Fix the article
        typography so it respects their setting, supply the changed CSS, and
        say what you changed. Plain CSS, no build step. Only these two
        stylesheets are involved; `tokens.css` loads first.

        ```css
        /* tokens.css: the design scale, in rem against the browser default root size of 16px */
        :root {
          --space-md: 1rem; /* 16px */
          --text-base: 1rem; /* 16px */
          --text-lg: 1.25rem; /* 20px */
          --text-xl: 1.5rem; /* 24px */
          --text-2xl: 2.5rem; /* 40px */
          --colour-brand: #0b57d0;
        }

        /* base.css */
        body { margin: 0; font-size: 16px; line-height: 24px; }
        .article h1 { font-size: 28px; line-height: 34px; }
        .article h2 { font-size: 22px; line-height: 28px; }
        .article p { font-size: 18px; line-height: 28px; }
        .article__quote {
          padding-inline-start: var(--space-md);
          border-inline-start: 4px solid var(--colour-brand);
        }
        @media (min-width: 768px) {
          .article h1 { font-size: 40px; line-height: 46px; }
        }
        ```
      rubric: |-
        - Leaves no `font-size` in `px` in `base.css`: every type size is a scale step through `var()` where one equals the pixel value (16px is `--text-base`, 40px is `--text-2xl`), and every other size is in `rem`, preferably as a new `rem` step added to `tokens.css`; no scale token is written in `px`.
        - Writes every `line-height` as a unitless number (for example `1.5` for 24px over 16px), with no `px`, `rem`, `em` or `%` unit.
        - Rewrites the media query in `rem` or `em` (for example `48rem`), not `768px`.
        - Keeps the quote's `border-inline-start` width at `4px`, and does not set `html` or `:root` `font-size` to a percentage such as `62.5%`.
        - Explains that `px` font sizes ignore the reader's text-size setting while `rem` follows it, and that a unitless line height scales with each element's own font size.

  - description: Keep selectors a repository search cannot prove unused and measure them first
    vars:
      skill: file://../../src/web/skills/css/SKILL.md
      scenario: |-
        A teammate writes: "I'm trying to slim down src/styles/legacy.css. As
        far as I can tell `.legacy-modal`, `.promo-banner--spring` and
        `.old-pricing-table` aren't used anywhere any more. Can you clear them
        out? Tell me what you did."

        Facts from the repository: a text search of the HTML, templates and
        scripts finds none of the three class names as literal text. The
        README says: "Some pages are rendered by our content management system
        from content that is not in this repository. They use these same
        stylesheets and class names." No other usage data exists.

        ```js
        // src/js/promo.js (runs on every page)
        const season = document.documentElement.dataset.season ?? "spring";
        for (const slot of document.querySelectorAll("[data-promo]")) {
          const banner = document.createElement("div");
          banner.className = `promo-banner promo-banner--${season}`;
          slot.replaceWith(banner);
        }
        ```

        ```css
        /* src/styles/legacy.css */
        .legacy-modal {
          position: fixed;
          inset: 0;
          display: grid;
          background-color: rgb(0 0 0 / 60%);
        }
        .promo-banner--spring { background-color: #e6f4ea; color: #137333; }
        .old-pricing-table {
          inline-size: 100%;
          border-collapse: collapse;
          background-image: url("../../img/table-stripes.png");
        }
        ```
      rubric: |-
        - Deletes none of the three rules now, and does not claim that any of the three is unused; it says only that the search could not show them in use.
        - Says `promo-banner--spring` is built at run time in `src/js/promo.js` (the template string with `${season}`, which defaults to `spring`), so a text search for it proves nothing and the rule stays.
        - Says that pages rendered from content outside the repository mean a repository search cannot show `.legacy-modal` or `.old-pricing-table` unused.
        - Adds a usage beacon, a `background-image: url(...)` with a unique per-selector URL and a comment that says when the rule may be deleted, to `.legacy-modal`, and does not replace the existing `table-stripes.png` image on `.old-pricing-table`; it records that selector's usage another way (for example a usage report or a script that reports matched selectors).
        - Names the evidence that would allow each deletion later: production usage logged over weeks to months with one test request confirmed to arrive, treating zero requests as evidence rather than proof because caches, a Content Security Policy or service workers can drop requests, followed by deletion in small reversible steps.

  - description: Give card spacing to its parents from the existing scale without context overrides
    vars:
      skill: file://../../src/web/skills/css/SKILL.md
      scenario: |-
        A teammate writes: "The plan cards in the pricing grid on the home page
        are touching each other, and in the sidebar the repair-kit card has a
        much bigger gap under it than anything else in the sidebar. Design want
        24px between the pricing cards, and the sidebar card spaced like the
        rest of the sidebar. Can you fix the spacing? Tell me what you changed."

        `.card` is used only inside `.pricing-grid` and `.sidebar`. The HTML
        cannot change. Only these rules are involved; `tokens.css` loads first.

        ```css
        /* tokens.css */
        :root {
          --space-sm: 0.5rem; /* 8px */
          --space-md: 1rem; /* 16px */
          --space-lg: 1.5rem; /* 24px */
          --space-xl: 2rem; /* 32px */
          --colour-border: #d0d7de;
        }

        /* layout.css */
        .pricing-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
        }
        .sidebar { display: flex; flex-direction: column; gap: var(--space-md); }

        /* components/card.css */
        .card {
          padding: var(--space-md);
          border: 1px solid var(--colour-border);
          border-radius: 8px;
          margin-bottom: 24px;
        }
        ```
      rubric: |-
        - Deletes the `margin-bottom` declaration from `.card` instead of setting it to `0`, so the card sets no margin outside its own box.
        - Adds no context override or reset for the card margin, such as `.sidebar .card { margin-bottom: 0; }`, `.pricing-grid .card { ... }` or a `:last-child` rule.
        - Gives `.pricing-grid` a `gap` taken from the existing 24px scale step, `var(--space-lg)`, not a raw `24px` or a new value.
        - Leaves the `.sidebar` gap (`var(--space-md)`) and the card's padding, `1px` border and `8px` radius unchanged.
        - Explains that the parent layout owns the space between components: the pricing cards touch because the grid has no gap, and the sidebar card's extra space comes from its own margin added to the sidebar gap.

  - description: Add a focusable skip link without reusing the immutable screen-reader utility
    vars:
      skill: file://../../src/web/skills/css/SKILL.md
      scenario: |-
        Keyboard users want a "Skip to content" link at the very top of the
        home page so they do not tab through the header every time. Add it to
        the page and put its styles in a new file,
        `src/styles/components/skip-link.css`, linked with its own `<link>`
        like the other stylesheets. It must show only when someone tabs to it.
        Supply the HTML and CSS changes and say what you did. The design scale
        has `--space-sm: 0.5rem`, `--space-md: 1rem` and `--text-base: 1rem`.

        ```html
        <body>
          <header class="site-header">...</header>
          <main id="content" class="page">...</main>
        </body>
        ```

        ```css
        /* src/styles/utilities.css (existing) */
        /* Text for screen readers only. Never put this class on an element that can receive focus. */
        .u-sr-only {
          position: absolute !important;
          width: 1px !important;
          height: 1px !important;
          padding: 0 !important;
          margin: -1px !important;
          overflow: hidden !important;
          clip-path: inset(50%) !important;
          white-space: nowrap !important;
          border-width: 0 !important;
        }
        ```
      rubric: |-
        - Adds the link as the first element in `<body>`, pointing at `#content`, with its own component class; it does not put `u-sr-only` on the link and leaves `.u-sr-only` and its `!important` declarations unchanged.
        - Hides the unfocused link by clipping it to 1px (for example `clip-path: inset(50%)`), not with `display: none`, `visibility: hidden`, `font-size: 0` or off-screen coordinates such as a negative `top`/`left` or a negative `translate`.
        - Uses no `!important` in `skip-link.css`; the `:focus` or `:focus-visible` rule restores every hiding property and shows an `outline` (not only a `box-shadow`).
        - Bounds the focused link's width to the viewport (for example `max-inline-size: calc(100vw - 2rem)`) so it fits a 320 CSS px viewport at 400% zoom, with text and padding in `rem` or scale steps.
        - Adds a `@media (forced-colors: active)` rule that gives the focused link system colours such as `Canvas`, `LinkText` or `Highlight`.

  - description: Document the one important declaration at an immutable vendor boundary
    vars:
      skill: file://../../src/web/skills/css/SKILL.md
      scenario: |-
        A teammate writes: "In the checkout section the 'Pay now' text comes
        out grey. It should be our brand blue. The checkout widget's
        stylesheet in vendor/ belongs to the payment provider and gets
        replaced whenever they update it, and the order the stylesheets load
        in and the checkout markup are set by their integration, so don't
        touch those. Our checkout styles are in
        src/styles/components/checkout.css. Fix it, and tell me why your fix
        wins."

        The brand blue is the token `--colour-brand: #0b57d0`.
        `checkout.css` loads before the vendor stylesheet.

        ```html
        <section id="checkout" class="checkout">
          <button class="button checkout__submit" type="submit">Pay now</button>
        </section>
        ```

        ```css
        /* src/styles/components/checkout.css */
        .checkout__submit {
          padding-block: var(--space-sm);
          background-color: var(--colour-brand-tint);
          color: #222222;
        }

        /* vendor/checkout-widget.css (provider-owned, replaced on every update) */
        #checkout .button {
          font-size: 1rem;
          color: #666666;
        }
        ```
      rubric: |-
        - Changes only `checkout.css`, and gives `.checkout__submit` exactly one `!important` declaration, on `color` (for example `color: var(--colour-brand) !important;`); it adds no ID selector, `[id=...]` selector, cascade layer, inline style, script or markup change, and leaves the vendor file and load order unchanged.
        - Puts a CSS comment beside that declaration that names the provider-owned boundary and states when to remove the `!important` (for example if the provider drops or changes its rule).
        - Explains that the vendor rule wins today because its ID selector outranks the app's class selector (load order may be mentioned too).
        - Explains that the fix wins because an important declaration beats the vendor's normal declaration whatever the vendor selector's specificity or position, not through specificity or source order.
        - Gives the provider-owned stylesheet, load order and markup as the reason for this exception.
