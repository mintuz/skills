# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Trigger-selection check for the css skill description. Not part of the
# scripted suite. Run it from the repo root with:
#   pnpm test:skills:triggers -- css
# which refreshes the git-ignored fixture from src/ first.
# A symlink does not work as the fixture: Codex resolves it to the source path,
# which the skill-used heuristic does not recognise.
description: css skill trigger selection

prompts:
  - id: file://prompts/trigger.txt
    label: trigger

providers:
  - id: openai:codex-sdk
    config:
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false

tests:
  - description: Activates on a plain CSS layout request
    vars:
      request: >-
        Write the CSS for a responsive pricing table: three columns on wide
        screens, stacked cards on narrow screens, with accessible focus styles
        on the "Choose plan" buttons. Plain CSS, no framework.
    assert:
      - type: skill-used
        value: css

  - description: Does not activate for Tailwind design tokens
    vars:
      request: >-
        Set up our Tailwind theme: map the brand colour and spacing design
        tokens into tailwind.config.js and add a CVA button variant with a
        dark-mode class strategy.
    assert:
      - type: not-skill-used
        value: css

  - description: Activates for plain-CSS custom-property design tokens
    vars:
      request: >-
        Define our spacing and colour design tokens as CSS custom properties on
        :root, with a dark theme via prefers-color-scheme, and use them in a
        plain-CSS button component. No Tailwind or other framework.
    assert:
      - type: skill-used
        value: css
