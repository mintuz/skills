description: "teach tutoring workflow versus no-skill baseline"
prompts:
  -
    id: "file://prompts/baseline.txt"
    label: "baseline"
  -
    id: "file://prompts/with-skill.txt"
    label: "with-skill"
providers:
  -
    id: "openai:codex-sdk"
    config:
      codex_path_override: codex
      model: "gpt-6-astra"
      model_reasoning_effort: "medium"
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: "read-only"
      approval_policy: "never"
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
defaultTest:
  assert:
    -
      type: "agent-rubric"
      metric: "rubric"
      threshold: 1
      value: "Judge only the response and its proposed procedure in this scenario-only evaluation. Tools and execution were explicitly unavailable; concrete proposed steps satisfy action criteria. Do not demand actual execution or files, but reject invented claims that actions ran. Every criterion must be met using the supplied facts. Scenario: {{scenario}}\n\n{{rubric}}"
      provider:
        id: "openai:codex-sdk"
        config:
          codex_path_override: codex
          model: "gpt-6-astra"
          model_reasoning_effort: "medium"
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: "read-only"
          approval_policy: "never"
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false
tests:
  -
    description: "Tutor request starts with a diagnostic, one question at a time"
    vars:
      skill: "file://../../src/core/skills/teach/SKILL.md"
      scenario: "/teach Quiz me on SQL joins until I've properly mastered them. A live person is in the chat and will answer each message. I know basic SELECT and WHERE. Give your first message to the person."
      rubric: "The reply runs a tutoring session, not an explanation. It splits SQL joins into a small set of concrete subskills (for example inner, left/right outer, full outer, cross or self joins, join conditions and NULL handling), between 4 and 10. It tells the person it will first ask a few questions, one at a time, to find what they already know. It then asks exactly one diagnostic question and ends the message on that question. It does not explain how joins work, does not give the answer, a hint or an example answer, and does not ask several questions at once."
  -
    description: "Tutor answers a wrong answer with a narrower question"
    vars:
      skill: "file://../../src/core/skills/teach/SKILL.md"
      scenario: "/teach Drill me on Python mutable default arguments. A live person is in the chat. Session state: subskill 'when default values are evaluated' is at level 2/5; this is the person's first attempt on this idea. You asked: 'def add(x, items=[]): items.append(x); return items. What does add(1) then add(2) return?' The person answered: 'add(2) returns [2], because items starts as a new empty list on each call.' Give your next message to the person."
      rubric: "The reply does not state the correct answer ([1, 2]) and does not explain that the default is evaluated once at definition time. It asks one narrower question that leads the person to the contradiction in their reasoning (for example, about when the line with items=[] runs, or what id(items) shows across two calls) and ends the message on that question. It does not flatter ('Great try!') and does not raise the level. It asks only one question."
  -
    description: "Tutor does not raise a level on answers echoed straight after being told"
    vars:
      skill: "file://../../src/core/skills/teach/SKILL.md"
      scenario: "/teach Tutor me on HTTP caching. A live person is in the chat. Session state: subskill 'Cache-Control max-age vs no-cache' is at level 2/5. Three messages ago, after three failed attempts, you explained directly that no-cache means a cache may store the response but must revalidate it before each reuse. Your follow-up question asked the same idea from a different angle, and the person answered it correctly by repeating your explanation. Give your next message to the person."
      rubric: "The reply does not raise the subskill above 2/5, because the only correct answer came straight after the person was told the answer and a level needs two or more independent checks with at least one unprompted recall. Any feedback or progress map comes before the question, not after it. The message ends with exactly one new question that tests the idea without repeating the explanation, or moves to another subskill and returns to this one later for unprompted recall. It does not flatter."
