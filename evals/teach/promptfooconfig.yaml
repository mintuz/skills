description: "teach portable workflow versus no-skill baseline"
prompts:
  -
    id: "file://prompts/baseline.txt"
    label: "baseline"
  -
    id: "file://prompts/with-skill.txt"
    label: "with-skill"
providers:
  -
    id: "openai:codex-sdk"
    config:
      codex_path_override: codex
      model: "gpt-6-astra"
      model_reasoning_effort: "medium"
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: "read-only"
      approval_policy: "never"
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
defaultTest:
  assert:
    -
      type: "agent-rubric"
      metric: "rubric"
      threshold: 1
      value: "Judge only the response and its proposed procedure in this scenario-only evaluation. Tools and execution were explicitly unavailable; concrete proposed steps satisfy action criteria. Do not demand actual execution or files, but reject invented claims that actions ran. Every criterion must be met using the supplied facts. Scenario: {{scenario}}\n\n{{rubric}}"
      provider:
        id: "openai:codex-sdk"
        config:
          codex_path_override: codex
          model: "gpt-6-astra"
          model_reasoning_effort: "medium"
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: "read-only"
          approval_policy: "never"
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false
tests:
  -
    description: "Plan stays within installed capabilities and authorisation"
    vars:
      skill: "file://../../src/core/skills/teach/SKILL.md"
      scenario: "Teach me how scrolling works in our chat view; I'm new to this code. First tell me your plan: which skills and tools you will use and in what order. This host has read/search files, a shell, the `teach` skill (invoked now), the `how` and `why` skills, and a subagent tool. Facts: ChatList.tsx:40 renders only the rows inside the viewport plus a 5-row buffer above and below; rowsStore.ts:12 evicts row data beyond 200 rows from memory and reloads it from IndexedDB when the user scrolls back; commit 9f2 says 'evict old rows, tabs hit 1GB on long chats'. The overlap between viewport, buffer and evicted rows is the part I find hard to picture. This is a planning-and-explaining exercise; do not call tools."
      rubric: "The plan reads the code, then runs how and why one after the other in the main session. It does not plan to run them in parallel or dispatch subagents or other delegated work, because the user has not authorised delegation; offering parallel runs as an option the user may approve is acceptable. No step invokes or depends on a capability the scenario does not list, such as a separate writing-style or rewriting skill, an image-generation tool or a named model. The viewport, buffer and eviction picture is drawn in the reply as text it can carry (mermaid, ASCII or SVG). The explanation then names the technique (list virtualization) in plain terms, ties it to this chat list, and separates the 1GB memory reason recorded in commit 9f2 from anything inferred."
  -
    description: "First answer is short and conversational"
    vars:
      skill: "file://../../src/core/skills/teach/SKILL.md"
      scenario: "Teach me what the outbox table in our billing service is. I'm reviewing a PR that touches it tomorrow. A live person is in the chat. Findings already gathered by how: OrderService.ts:55 writes the order row and an outbox row in the same database transaction; relay.ts:20 polls the outbox every 2s, publishes each row to Kafka, then marks it sent; consumers dedupe by event id. Findings already gathered by why: PR #412 says 'dual writes lost events when Kafka was down'. Give your first message to the person."
      rubric: "The first message opens with a short plain definition of the technique (the transactional outbox pattern: storing the event in the same transaction as the data so it is published reliably later) tied to this billing service, and states the problem it solves (events lost by dual writes when Kafka was down, per PR #412). It stays short: a few sentences or a compact answer, not a multi-section explainer covering the relay, dedupe and edge cases in full. It offers to go deeper or names the threads worth following and leaves the choice to the person. It contains no quiz, no request to restate the idea back, no 'pause' instruction, and no framing labels such as 'key insight', 'TL;DR' or 'the one thing to remember'. It is the explanation itself, not a report about what was done."
  -
    description: "Confidence language survives rewording"
    vars:
      skill: "file://../../src/core/skills/teach/SKILL.md"
      scenario: "Help me understand why our webhook sender retries exactly 5 times with jittered backoff; I'm about to raise it to 10. Findings from how: sender.ts:30 retries up to 5 times with a 500ms base and full jitter, then moves the delivery to a dead-letter queue. Findings from why, narrowed to git history and linked tickets (incidents and analytics were not searched): commit a1 'cap retries at 5 per partner request' links ticket PART-88, where partner Acme asked for at most 5 delivery attempts. Commit b2 added jitter with the code comment 'avoid thundering herd'; no incident record was found for it. Whether the cap matters for partners other than Acme is unknown. Explain it to me."
      rubric: "Explains the retry, jitter and dead-letter mechanism plainly. States Acme's request in PART-88 as the recorded reason for 5. Presents the thundering-herd reason as the intent written down in commit b2, without claiming an incident or measurement proved it. Says it is unknown whether the cap matters for other partners and that incidents and analytics were not searched. Points out that raising to 10 would exceed Acme's recorded limit, as a constraint to check before changing it. Does not invent a benchmark, incident or decision, and does not make or draft the change."
  -
    description: "Picture assembles one part at a time"
    vars:
      skill: "file://../../src/core/skills/teach/SKILL.md"
      scenario: "Teach me how a request reaches our API. Path: browser to CDN edge, CDN edge to load balancer, load balancer to an API pod, API pod reads Redis, and on a Redis miss the pod reads Postgres and fills Redis. This runs one-shot with no live person to reply, and mermaid renders in this chat."
      rubric: "Uses a short series of diagrams in which each one redraws the previous one and adds one new component or path (for example browser to CDN, then the load balancer, then the pod, then Redis, then the Postgres miss path with its read and refill), with a sentence or two explaining each addition. The reply does not rely on a single diagram showing every part at once. It starts with a plain summary of the path. General explanations of what each kind of component does are fine, but it does not state specifics of this system beyond the supplied path (such as CDN caching rules, a load-balancing algorithm or cache expiry) as fact. It includes an offer to go deeper at the end rather than pausing for a reply; it may also suggest next steps."
