# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: XState skill versus no-skill baseline

prompts:
  - id: file://prompts/baseline.txt
    label: baseline
  - id: file://prompts/with-skill.txt
    label: with-skill

providers:
  - id: openai:codex-sdk
    config:
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false

defaultTest:
  vars:
    skill: file://../../src/web/skills/xstate/SKILL.md
    modelling: file://../../src/web/skills/xstate/references/modelling.md
    lifecycles: file://../../src/web/skills/xstate/references/lifecycles.md
    react: file://../../src/web/skills/xstate/references/react.md
    testing: file://../../src/web/skills/xstate/references/testing.md
    diagramming: file://../../src/web/skills/xstate/references/diagramming.md
  assert:
    - type: agent-rubric
      metric: rubric
      threshold: 1
      value: |-
        Judge only whether the XState response reaches every observable outcome
        required by this scenario. Give equal weight to every outcome below.
        Credit concrete XState 5 logic and explicit lifecycle reasoning rather
        than copied rubric wording, verbosity, or invented project facts.

        {{rubric}}
      provider:
        id: openai:codex-sdk
        config:
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false

tests:
  - description: Replace a reconnecting subscription without accepting stale generations
    vars:
      scenario: |-
        Implement the smallest XState 5 machine factory for a mounted market-price
        panel. `openFeed(symbol)` returns a handle with `subscribe(onPrice, onError)`,
        `unsubscribe()`, and `close()`. The feed reports every failure through
        `onError`; `openFeed` itself never throws. A symbol change must replace the current
        feed. After close, the old handle can still deliver one buffered price or
        one buffered error.
        A feed error waits for an injected retry delay, then reconnects. Changing
        symbol or sending `STOP` during that delay must prevent the retry. The UI
        needs only the current symbol, last accepted price, and lifecycle status.

        Return typed machine code plus the smallest actor-boundary tests that prove
        stale delivery, retry cancellation, and teardown. Do not add a dependency,
        put a live handle in context, or use React effects to own the feed.
      rubric: |-
        - Returns an XState 5 typed machine factory whose injected ports include feed creation and retry timing, with serialisable context and no live feed handle in context.
        - Owns opening, subscription, unsubscription, and close together inside an invoked callback actor, and its disposer makes both replacement and parent stop release the resource exactly once.
        - Gives each feed an identity that no replaced feed can share — a monotonic generation, or the symbol together with a generation — echoes it in the price and error events the actor sends back, and acts on a price or an error only while that identity is still current, so a buffered price or error from the replaced handle is harmless.
        - Models retry as lifecycle state/time owned by the machine; symbol change and `STOP` leave that lifecycle so its delayed reconnect cannot start.
        - Uses focused actor-derived lifecycle status rather than mirrored loading/error booleans, and supplies actor-boundary tests that explicitly prove stale delivery is ignored, retry is cancelled both by a symbol change and by `STOP`, and teardown is counted.

  - description: Confirm optimistic completion only after matching authoritative convergence
    vars:
      scenario: |-
        Design an XState 5 machine for one editable document. `SAVE` creates a
        command ID and optimistically shows the submitted title. The transport
        later emits `COMMAND_ACCEPTED { commandId, version }`; a separate document
        stream emits `DOCUMENT_OBSERVED { commandId, version, title }`. Either can
        arrive first. A save is complete only when the matching observed version is
        at least the accepted version. A second `SAVE` supersedes the first, whose
        late acceptance or observation must not alter the current attempt.

        The same stream also carries other people's edits: a `DOCUMENT_OBSERVED`
        can arrive whose `commandId` this client never sent. The stream replays,
        so such an event can be older than what is already on screen. It must
        update the rendered document only when its version is newer than the
        newest version already applied, and it must never complete or discard the
        current attempt's optimistic title.

        Return the typed lifecycle and a legal `stateDiagram-v2` diagram. Include
        the public actor tests needed for both arrival orders, stale command IDs,
        and non-increasing observed versions. Keep transport acceptance,
        authoritative truth, and rendered status distinct.
      rubric: |-
        - Models the in-flight, converging phase as a state distinct from the settled phase, and keeps the current command ID, the accepted version, the latest authoritative observed version and title, and the optimistic title in context rather than in that state name.
        - On every `SAVE`, creates a fresh identity and resets attempt-scoped acceptance/observation fields; acceptance and the completion decision are fenced by the current command ID.
        - Stores acceptance and matching authoritative observation independently, rechecks convergence after either arrival order, and reaches completion only when observed version is greater than or equal to accepted version.
        - Decides two things separately for every `DOCUMENT_OBSERVED`, whoever sent it: it changes the rendered document only when the observed version is newer than the newest document version already applied, and it changes attempt evidence only when the command ID is the current attempt's and the version advances the version already recorded for that attempt. An observation from another client never completes or clears the current attempt, and transport acceptance alone is never completion.
        - Supplies public actor tests for acceptance-first, observation-first, a superseded command's late events, and non-increasing observations, plus a syntactically legal `stateDiagram-v2` diagram whose transitions match the implementation and whose validation status is reported accurately.

  - description: Decline XState for state one event sets completely
    vars:
      scenario: |-
        Review this React 19 component and tell me which of its state should move
        into an XState 5 machine. XState 5 and `@xstate/react` are already
        installed in this repository and used elsewhere.

        ```tsx
        function TagPanel({ tags, rename }: { tags: string[]; rename: (from: string, to: string) => void }) {
          const [draft, setDraft] = useState("");
          const [isPanelOpen, setIsPanelOpen] = useState(false);
          const [focusedTag, setFocusedTag] = useState<string | null>(null);
          // renders an input bound to draft, a disclosure button that toggles
          // isPanelOpen, and a list whose items set focusedTag on focus
        }
        ```

        These are the complete facts. `rename` is synchronous: it writes to an
        in-memory store the parent owns and returns `void`, never a promise. The
        panel appears and disappears in one frame with no animation and no
        transition. This file and `rename` contain no request, timer, interval,
        subscription, document listener, or pointer capture, and nothing is
        disposed when the component unmounts.
      rubric: |-
        - Recommends no XState machine for this component and keeps all three `useState` hooks in React.
        - Gives a separate verdict for `draft`, `isPanelOpen`, and `focusedTag`, and every verdict is that the value stays in React.
        - Justifies each verdict from the stated facts — one event sets the value completely, no external answer supplies it, and there is nothing to dispose — rather than from the value's name or from how it is rendered.
        - Invents no fact beyond the packet: it does not assume a network call, persistence, debounce, animation, or unmount cleanup that the scenario denies, and it proposes no new dependency.
        - Adds no machine file, statechart diagram, actor test plan, or folder-layout advice for this component; any XState suggestion it makes is explicitly conditional on a fact the scenario does not state.

  - description: Fix a debounced search whose stale response overwrites current results
    vars:
      scenario: |-
        Review this component and replace it with the smallest XState 5 machine
        that fixes its defects. XState 5 is installed. Do not add a dependency.

        ```tsx
        function AssigneeSearch({ query, search }: { query: string; search: (q: string) => Promise<User[]> }) {
          const [results, setResults] = useState<User[]>([]);
          const [isLoading, setIsLoading] = useState(false);
          const [error, setError] = useState<string | null>(null);

          useEffect(() => {
            let ignore = false;
            setIsLoading(true);
            const timer = setTimeout(() => {
              search(query)
                .then((users) => { if (!ignore) { setResults(users); setIsLoading(false); } })
                .catch((e) => { if (!ignore) { setError(e.message); setIsLoading(false); } });
            }, 250);
            return () => { clearTimeout(timer); };
          }, [query, search]);

          return <List items={results} loading={isLoading} error={error} />;
        }
        ```

        These are the complete facts. `search` takes no abort signal and cannot be
        cancelled once called. The backend can resolve two searches out of order,
        so a request for an older query can settle after a newer one. The list
        must only ever show results for the current query text, and a previous
        query's error must disappear as soon as the query changes. The 250 ms
        debounce must stay.

        Return the typed machine factory and the actor-boundary tests that prove
        the stale case.
      rubric: |-
        - Names both defects in the existing code: the cleanup never sets `ignore`, so a superseded query's response can overwrite the current results; and `error` is never cleared, so a previous query's error survives into the new query.
        - Returns an XState 5 typed machine factory that takes the search function as an injected port, and owns the 250 ms debounce as an `after` delayed transition inside the machine instead of a `setTimeout` inside a React effect, so leaving the state cancels it.
        - Explains accurately why a superseded response can no longer change the state: leaving or re-entering the searching state stops the previous invocation, so XState discards its result, while `search` itself keeps running because it takes no abort signal. If the answer also adds a per-query identity fence, it says which of the two mechanisms does the work instead of presenting the request as cancelled.
        - Replaces the `isLoading` and `error` booleans with mutually exclusive lifecycle states, and resets the attempt-scoped error and results when a new query supersedes the previous one.
        - Supplies actor-boundary tests that drive a real actor and prove a late result for a superseded query changes nothing, and it does not claim to have run code, read repository files, or use any fact outside this packet.

  - description: Model an interruptible drag that must cancel and release capture
    vars:
      scenario: |-
        Build the smallest XState 5 machine for a resizable table column in a
        React 19 app. XState 5 and `@xstate/react` are installed. Do not add a
        dependency.

        These are the complete facts. `pointerdown` on the drag handle calls
        `handle.setPointerCapture(pointerId)` and starts the resize from the
        current saved width. While the resize runs, `pointermove` and `pointerup`
        listeners are attached to `document`, and a `keydown` listener watches for
        Escape. `pointermove` updates the width being previewed. `pointerup`
        commits by calling the injected `saveWidth(width: number): Promise<void>`.
        Escape at any point during the resize abandons it: the column returns to
        the width it had before this resize started, and no save is sent.
        `saveWidth` has no abort signal; if it rejects, the column returns to the
        last successfully saved width. The component can unmount at any moment,
        including mid-resize, and the listeners and the pointer capture must be
        released when it does.

        Return the typed machine and one `stateDiagram-v2` diagram of it.
      rubric: |-
        - Models the resize as mutually exclusive lifecycle states — at least an idle state, a state for the in-progress drag, and a state for the pending save — instead of an `isDragging` or `isSaving` boolean.
        - Puts the `document` listeners and the release of the pointer capture inside an invoked callback actor whose returned disposer removes every listener and releases the capture, so Escape, a commit, and parent stop all release them; if the capture is taken in the React `pointerdown` handler rather than inside the actor, the response says the handle is passed to the actor, which then owns the release.
        - Escape during the resize restores the width held before the resize started and sends no save; a rejected `saveWidth` restores the last successfully saved width; and the response states that stopping the save actor cannot abort the in-flight `saveWidth` call, so the outcome is handled rather than assumed cancelled.
        - Returns one fenced `mermaid` block whose first line is exactly `stateDiagram-v2`, whose states and transitions match the machine just written, and which contains no transition joining internal states of two different composites and no semicolon inside a transition label.
        - States a validation status for the diagram, and that status is not `rendered`: nowhere in the response does it assert that a renderer, a parser, a test suite, or a shell command actually ran.
