description: "maintain-formal-verification-skill workflow versus no-skill baseline"
prompts:
  - id: "file://prompts/baseline.txt"
    label: "baseline"
  - id: "file://prompts/with-skill.txt"
    label: "with-skill"
providers:
  - id: "openai:codex-sdk"
    config:
      codex_path_override: codex
      model: "gpt-6-astra"
      model_reasoning_effort: "medium"
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: "read-only"
      approval_policy: "never"
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
defaultTest:
  vars:
    skill: "file://../../src/core/skills/maintain-formal-verification-skill/SKILL.md"
  assert:
    - type: "agent-rubric"
      metric: "rubric"
      threshold: 1
      value: "Judge only the response and proposed procedure in this scenario-only evaluation. Tools and execution were explicitly unavailable; concrete proposed steps satisfy action criteria. Do not demand actual execution or files, but reject invented execution claims. Every criterion must be met using the supplied facts. Scenario: {{scenario}}\n\n{{rubric}}"
      provider:
        id: "openai:codex-sdk"
        config:
          codex_path_override: codex
          model: "gpt-6-astra"
          model_reasoning_effort: "medium"
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: "read-only"
          approval_policy: "never"
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false
tests:
  - description: "maintain an Everystate project skill"
    vars:
      scenario: "The saved model at revision A still passes at B. Cleanup moved into a callback and now compares only the shared key. Another function also writes the active worker. The ownership contract is unchanged. Explain how to maintain the project skill, distinguish drift from a bug, and handle a missing runtime trace."
      rubric: "Runs the baseline before edits, inspects both writers and interleavings since A, updates actions from source, and retains the ownership promise. Replays the witness with Everystate and seeks ordered runtime conformance. Distinguishes stale passing model from product bug and missing runtime evidence; leaves blocked sync evidence unadvanced and avoids modifying product behavior."
