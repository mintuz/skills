description: "principle-exhaust-the-design-space activation and exclusion"
prompts:
  - id: file://prompts/trigger.txt
    label: trigger
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  - description: Selects relevant guidance
    vars:
      request: "A scheduling interface needs a new way to resolve overlapping events. Users must compare dates, keyboard use must work, and there is no existing interaction precedent. You have permission for prototypes only. Describe the decision process."
    assert:
      - type: skill-used
        value: principle-exhaust-the-design-space
  - description: Excludes a plain translation
    vars:
      request: "Translate only this sentence into French: The green notebook is on the table."
    assert:
      - type: not-skill-used
        value: principle-exhaust-the-design-space
