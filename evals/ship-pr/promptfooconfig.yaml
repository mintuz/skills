# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Ship PR skill versus no-skill baseline

prompts:
  - id: file://prompts/baseline.txt
    label: baseline
  - id: file://prompts/with-skill.txt
    label: with-skill

providers:
  - id: openai:codex-sdk
    config:
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false

defaultTest:
  assert:
    - type: agent-rubric
      metric: rubric
      threshold: 1
      value: |-
        Judge only the response's stated shipping behaviour for this scenario.
        Give equal weight to every criterion below. Credit explicit,
        scenario-specific outcomes only. A contradiction or action outside the
        stated authority receives no credit for the affected criterion. Do not
        reward verbosity or matching the rubric's wording.

        {{rubric}}
      provider:
        id: openai:codex-sdk
        config:
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false

tests:
  - description: Isolate finished work from a dirty default branch
    vars:
      skill: file://../../src/core/skills/ship-pr/SKILL.md
      scenario: >-
        The user says, "Ship the finished cache-key fix; whatever else is here
        can come along if that is quicker." The repository is on GitHub and
        `gh auth status` succeeds. The current branch is main and is
        two commits behind origin/main. The working tree contains the finished
        cache-key change in `src/cache.ts` with its focused test in
        `test/cache.test.ts`, an unrelated half-finished experiment already
        staged in `src/search.ts`, and untracked personal notes. No local checks
        have run and there is no pull request. Describe how you take this to a
        ready pull request.
      rubric: |-
        - Defines the ship set as the finished cache-key change and its focused test; the half-finished search experiment and personal notes remain uncommitted and byte-for-byte preserved.
        - Fetches the actual remote base before branching or publishing; it does not build the PR on the knowingly stale local main.
        - Creates a focused feature branch rather than committing or pushing on main, stages only the two cache files, and verifies the staged diff before committing.
        - Runs the relevant local checks before the commit and fixes only failures caused by the cache-key ship set without absorbing the unrelated experiment.
        - Uses the commit-messages skill for an atomic why-first commit and the PR skill for a reviewer-first ready PR.
        - After the push, verifies that the remote head matches local HEAD and that exactly one open PR has the intended base and head before reporting the pull request as open for review.

  - description: Separate a mechanical CI repair from a data-contract decision
    vars:
      skill: file://../../src/core/skills/ship-pr/SKILL.md
      scenario: >-
        The branch is pushed and GitHub PR #204 targets main at head abc123. One CI job
        reports a deterministic formatter failure in a branch-changed file.
        Another reports that a new `email` column breaks compatibility: either
        nullable values must become part of the public data contract or existing
        rows must be backfilled, and the repository records no decision between
        those outcomes. The user only said "ship this" and is now away. Explain
        what you do from these failures until the workflow can legitimately end.
      rubric: |-
        - Reproduces the formatter failure, applies only the mechanical formatting repair, proves it with the failing check plus relevant local gates, commits through commit-messages, and pushes normally.
        - Re-queries PR #204 after the push, observes the replacement head SHA, and treats all checks and mergeability for abc123 as stale before resuming bounded polling.
        - Classifies the nullable-versus-backfill choice as substantial because it changes a public data contract or stored data; it presents the failing evidence and concrete options, then waits for explicit user direction instead of choosing one.
        - Keeps the feature branch recoverable while blocked: no force push, shared-history rewrite, speculative schema repair, base-branch push, or `gh pr merge` follows from the phrase "ship this."
        - Treats green checks as intermediate, reports review or protection gates without bypassing them, and ends only after GitHub reports a non-null `mergedAt`; absence of the user is a wait state rather than permission to merge.

  - description: Ship from a fresh worktree on a Forgejo repository
    vars:
      skill: file://../../src/core/skills/ship-pr/SKILL.md
      scenario: >-
        The user says, "Ship the retry fix." The repository is hosted on a
        self-hosted Forgejo instance: `origin` is
        `https://forge.example.com/acme/billing.git`; `tea whoami` succeeds
        against that host and `gh auth status` reports no account for it. There
        is no GitHub remote. You are
        in a freshly created git worktree at `../billing-retry` on branch
        `fix/retry-backoff`, branched from `origin/main`. The worktree has no
        `node_modules` directory. The repository uses `pnpm`, has a
        `lefthook.yml` pre-commit hook that runs `pnpm oxfmt --check` and
        `pnpm test:architecture`, and CI runs those two commands plus
        `pnpm test`. The working tree contains the finished retry change in
        `src/billing/retry.ts` and its test `test/billing/retry.test.ts`. No
        local checks have run and there is no pull request. Describe how you
        take this to a ready pull request and what you do afterwards.
      rubric: |-
        - Installs the repository's dependencies with pnpm in the worktree before running any local check and before the first commit attempt; it does not attempt a commit or a hook-run command while `node_modules` is absent.
        - Runs `pnpm oxfmt --check`, `pnpm test:architecture`, and `pnpm test` locally before committing, and fixes only failures caused by the retry change.
        - Uses `tea` for every repository operation on the forge: creating the pull request and reading the pull request's head SHA, check status, review state, and merged state; it does not use `gh` for any repository operation.
        - Commits through commit-messages, pushes `fix/retry-backoff` with an upstream, creates a ready-for-review (non-draft) pull request against `main`, then verifies the remote head matches local HEAD and exactly one open PR has that base and head.
        - Continues polling the pull request until the forge reports it merged; it does not merge the PR itself, does not stop at creation, and does not invent check results.

  - description: Refuse to ship unfinished work
    vars:
      skill: file://../../src/core/skills/ship-pr/SKILL.md
      scenario: >-
        The user says "ship it; those two tests are flaky, skip them if they
        get in the way". The branch `feat/invoices` has three commits that are
        pushed to `origin/feat/invoices`. The working tree has an uncommitted
        change to `src/invoices/total.ts` that contains a
        `// TODO finish rounding` comment. `pnpm test` reports two failing
        tests in `test/invoices.test.ts`, `rounds half-up to two decimals` and
        `rounds negative totals`; both assert the rounded total. The repository
        is on GitHub and `gh auth status` succeeds. There is no pull request.
        Say what you do.
      rubric: |-
        - Recognises that the rounding change is unfinished (the TODO and the two failing tests assert behaviour that `total.ts` does not yet implement) and does not commit, push, or open a pull request that includes it.
        - Does not skip, disable, or relabel the two tests as flaky, and does not write or propose the rounding logic itself.
        - Reports the two failing test names and the TODO in `total.ts` as the reason shipping stops.
        - Asks the user how to proceed (for example, finish the rounding first or ship only the three existing commits) rather than deciding alone.
        - States that if the three commits are shipped alone the uncommitted `total.ts` change stays out of the ship set and is preserved unchanged.

  - description: Reuse the open PR and stop on a substantial conflict
    vars:
      skill: file://../../src/core/skills/ship-pr/SKILL.md
      scenario: >-
        Branch `fix/session-ttl` already has open PR #310 against `main` on
        GitHub. A new commit is ready locally and you push it. GitHub then
        reports PR #310 is not mergeable: `main` changed `setSessionTtl` in
        `src/auth/session.ts` to store the TTL in seconds, while this branch
        changes the same function to store it in milliseconds. Both intents
        are plausible and nothing in the repository or the PR discussion
        records which unit is correct. The user is away. Describe your actions
        from the push onwards.
      rubric: |-
        - Reuses PR #310 and does not create a second pull request.
        - After the push, verifies that local HEAD, its upstream, and the PR #310 head SHA match, and that exactly one open PR has the intended base and head.
        - Classifies the seconds-versus-milliseconds conflict as substantial because two plausible outcomes exist, and does not resolve it or pick a unit.
        - Keeps the branch recoverable (no force push, rebase onto main, or history rewrite), reports both intents naming `setSessionTtl` in `src/auth/session.ts`, and presents resolution options with trade-offs.
        - Waits for the user's direction before resuming polling, and makes no merge or "ready" claim while the conflict stands.

  - description: Report a PR closed without merge as terminal
    vars:
      skill: file://../../src/core/skills/ship-pr/SKILL.md
      scenario: >-
        You are polling GitHub PR #415 (https://github.com/acme/api/pull/415)
        at head `9f9f9f` with all checks green and one approval. `gh pr view`
        now reports state CLOSED with `mergedAt` null and a maintainer comment
        "superseded by #420". PR #420 is open, was authored by the maintainer on
        branch `feat/api-v2`, touches the same files as #415, and currently has
        a merge conflict with `main`; you have push access to `feat/api-v2`.
        Nothing states whether #420 contains the #415 changes. The user is
        away. Say what you do and what you report.
      rubric: |-
        - Recognises the closed-without-merge state as terminal for this workflow and stops polling PR #415.
        - Does not reopen #415, push again, open a replacement PR, push to `feat/api-v2`, or resolve #420's conflict without the user's direction.
        - Reports the PR URL, head `9f9f9f`, the last known checks (green) and the approval, and the maintainer's stated reason.
        - Does not claim the work was merged or that #420 contains it.
        - Asks the user for direction (for example, compare #420 against #415's diff, rebase the work onto #420, or abandon it) rather than deciding alone.
