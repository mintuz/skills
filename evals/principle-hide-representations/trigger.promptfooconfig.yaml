description: "principle-hide-representations activation and exclusion"
prompts:
  - id: file://prompts/trigger.txt
    label: trigger
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  - description: Selects relevant guidance
    vars:
      request: "Our API returns Prisma rows and Stripe SDK objects straight to the React app, so every schema change breaks the UI. How should the module boundary look?"
    assert:
      - type: skill-used
        value: principle-hide-representations
  - description: Excludes logic trapped in a handler
    vars:
      request: "Our Express refund handler mixes request parsing, database calls and the refund-eligibility rules, so we can only test the rules through HTTP. How should we restructure it?"
    assert:
      - type: not-skill-used
        value: principle-hide-representations
