description: "principle-report-every-transition activation and exclusion"
prompts:
  - id: file://prompts/trigger.txt
    label: trigger
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  - description: "Selects relevant guidance"
    vars:
      request: "Babysit PR #301 until CI is green. You can push fixes to that branch. I'll be in meetings all afternoon."
    assert:
      - type: skill-used
        value: principle-report-every-transition
  - description: "Excludes a one-off stakeholder update"
    vars:
      request: "Write this week's status update for stakeholders on the billing migration: two milestones done, one slipped a week."
    assert:
      - type: not-skill-used
        value: principle-report-every-transition
