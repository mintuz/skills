description: "principle-subtract-before-you-add activation and exclusion"
prompts:
  - id: file://prompts/trigger.txt
    label: trigger
providers:
  - id: openai:codex-sdk
    config:
      model: gpt-6-astra
      codex_path_override: codex
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        model_reasoning_effort: medium
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  - description: Applies to the principle decision
    vars:
      request: "I'm about to add a new validator layer and a second retry queue to our import service. The service already has older validators and a queue whose callers I haven't checked. Plan the change."
    assert:
      - type: skill-used
        value: principle-subtract-before-you-add
  - description: Does not impose a workflow on a literal conversion
    vars:
      request: "Convert the literal text \"hello world\" to uppercase. Return only the converted text; no software design, implementation, or verification task is requested."
    assert:
      - type: agent-rubric
        threshold: 1
        value: "The response supplies HELLO WORLD and adds no principle-driven software workflow. A trailing none marker is acceptable. Do not count a skill-file read alone as a failure."
        provider:
          id: openai:codex-sdk
          config:
            model: gpt-6-astra
            codex_path_override: codex
            working_dir: ./trigger-workspace
            skip_git_repo_check: true
            sandbox_mode: read-only
            approval_policy: never
            network_access_enabled: false
            web_search_enabled: false
            cli_config:
              model_reasoning_effort: medium
              features:
                apps: false
                plugins: false
                skill_search: false
  - description: Leaves a hard-to-trace path with no addition to its owner
    vars:
      request: "A request value in our service passes through five wrapper functions and a mutable context object before it reaches the handler. Nothing new is being added; I just want the path easier to trace. What should I do?"
    assert:
      - type: not-skill-used
        value: principle-subtract-before-you-add
