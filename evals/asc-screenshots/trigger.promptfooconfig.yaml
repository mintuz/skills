# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Trigger-selection check for the asc-screenshots skill description.
# Run it from the repo root with:
#   pnpm test:skills:triggers -- asc-screenshots
# which refreshes the git-ignored fixture from src/ first.
# A symlink does not work as the fixture: Codex resolves it to the source path,
# which the skill-used heuristic does not recognise.
description: asc-screenshots skill trigger selection

prompts:
  - id: file://prompts/trigger.txt
    label: trigger

providers:
  - id: openai:codex-sdk
    config:
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false

tests:
  - description: Activates on a screenshot update that does not name the CLI
    vars:
      request: >-
        Update the App Store screenshots for version 3.0.0 for each locale.
        The new exports are in `marketing/screenshots/` under one folder per
        locale.
    assert:
      - type: skill-used
        value: asc-screenshots

  - description: Activates on a preview replacement for one locale
    vars:
      request: >-
        Replace the App Store previews for `de` on version 2.4.1 with the new
        cut in `exports/previews/de/`.
    assert:
      - type: skill-used
        value: asc-screenshots

  - description: Does not activate for screenshot design work
    vars:
      request: >-
        Design a new set of App Store screenshots for the 6.9-inch iPhone:
        device frames, captions on a gradient background, one per feature.
        Nothing needs uploading yet.
    assert:
      - type: not-skill-used
        value: asc-screenshots
