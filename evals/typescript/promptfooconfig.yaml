# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: TypeScript skill versus no-skill baseline

prompts:
  - id: file://prompts/baseline.txt
    label: baseline
  - id: file://prompts/with-skill.txt
    label: with-skill

providers:
  - id: openai:codex-sdk
    config:
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false

defaultTest:
  assert:
    - type: agent-rubric
      metric: rubric
      threshold: 1
      value: |-
        Judge only whether the proposed TypeScript patch reaches every observable
        outcome required by this scenario. Give equal weight to every outcome
        below. Credit concrete code and scenario-specific reasoning, not copied
        rubric wording or generic best-practice claims.

        {{rubric}}
      provider:
        id: openai:codex-sdk
        config:
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false

tests:
  - description: Validate an untrusted payload without inventing a dependency
    vars:
      skill: file://../../src/typescript/skills/typescript/SKILL.md
      scenario: |-
        Implement `decodeJob(value: unknown): DecodeResult` at an HTTP JSON
        boundary. A valid job has a non-empty string `id` and a non-negative
        integer `attempts`. `DecodeResult` is already defined as
        `{ ok: true; value: Job } | { ok: false; error: "invalid-job" }`, and
        `Job` has readonly `id` and `attempts` fields. The package has no runtime
        validation dependency, its dependency set is frozen, and an existing
        `isRecord(value: unknown): value is Record<string, unknown>` helper is
        available. Invalid input must return the error variant rather than throw.

        Return the minimum implementation only. It must compile under strict
        TypeScript without `any`, assertions, new dependencies, or changes to the
        supplied types and helper.
      rubric: |-
        - Accepts `unknown` and calls the supplied `isRecord` helper before reading properties.
        - Requires `id` to be a non-empty string and `attempts` to be both a number and a non-negative integer.
        - Returns `{ ok: false, error: "invalid-job" }` for every failed check and the supplied success variant for valid input; it does not throw.
        - Uses no `any`, type assertion, schema-library import, new helper abstraction, or dependency change.
        - Keeps the patch to the decoder implementation and relies on control-flow narrowing so the valid fields construct `Job` safely.

  - description: Preserve public immutability without quadratic copying
    vars:
      skill: file://../../src/typescript/skills/typescript/SKILL.md
      scenario: |-
        Implement `groupRows(rows: readonly Row[]): Readonly<Record<Status,
        readonly Row[]>>`, where `Status` is `"queued" | "running" | "done"`
        and every `Row` has readonly `id` and `status`. Production batches contain
        100,000 rows. The caller's array and rows must remain unchanged, output
        order within each status must match input order, and the implementation must
        traverse `rows` once and run in O(n).
        The project targets ES2022, has no utility dependency, and permits local
        mutation that cannot escape before return.

        Return the minimum implementation and state why it satisfies the public
        immutability and complexity requirements. Do not add abstractions or
        change the supplied types.
      rubric: |-
        - Creates fresh queued, running, and done buckets, so neither the caller's array nor any caller-owned row is mutated.
        - Traverses `rows` once and appends each row directly to exactly one fresh local bucket, preserving input order within each status.
        - Avoids per-row array or object spreading, concatenation, sorting, and any second traversal of `rows`, so the cost stays linear in the number of rows.
        - Returns the three buckets under the exact Status keys with a type that satisfies the supplied readonly public return contract.
        - Adds no helper, dependency, clone of each immutable row, or speculative validation.

  - description: Keep an undocumented external field unknown instead of guessing it
    vars:
      skill: file://../../src/typescript/skills/typescript/SKILL.md
      scenario: |-
        Extend `parseWebhook(value: unknown): WebhookResult<Webhook>` for a payment
        provider webhook. The provider documents three fields: `event`, which is
        either `"charge.succeeded"` or `"charge.failed"`; `id`, a string; and
        `data`, which is present on every event but is described only as a
        "provider-specific object" with no published field list. The repository
        already depends on zod v3, and
        `WebhookResult<T> = { ok: true; value: T } | { ok: false; error: string }`
        is already exported. Downstream code reads only `event` and `id` today.

        Return the minimum schema, the `Webhook` type, and the parse function. Do
        not guess undocumented fields.
      rubric: |-
        - Validates `event` against exactly the two documented literals and validates `id` as a string.
        - Requires `data` to be present and object-shaped, for example a record of unknown values, while leaving its fields unknown and unguessed.
        - States the limit of the check: `data` is validated only as a present object, and its fields are left unvalidated because the provider does not document them.
        - Returns the supplied `WebhookResult` failure variant when parsing fails, instead of throwing out of `parseWebhook`.
        - Invents no `data` field names, uses no `any` and no type assertion, and adds no downstream handling for fields the scenario does not mention.

  - description: Narrow a validated string to a branded type in one place
    vars:
      skill: file://../../src/typescript/skills/typescript/SKILL.md
      scenario: |-
        Add `AccountId` to a package whose lint rules ban `any`, ban
        `@ts-expect-error`, and flag every `as` assertion for reviewer sign-off. A
        valid account id is exactly 12 lowercase hexadecimal characters. The team
        has already agreed on `string & { readonly brand: unique symbol }` as the
        branding technique. Callers hold raw strings taken from a CLI argument.
        Write `toAccountId(raw: string): AccountId | null`. `loadAccount` already
        exists as `loadAccount(id: string): Promise<Account>`; its body is out of
        scope and only its parameter type may change.

        Return the minimum implementation. State how it satisfies both the
        branding requirement and the assertion lint rule.
      rubric: |-
        - Declares the branded type and a `toAccountId` that returns `null` unless the input is exactly 12 lowercase hexadecimal characters.
        - Narrows `string` to `AccountId` in exactly one place, by either a user-defined type predicate or a single assertion, and only where the 12-character lowercase hexadecimal check has already passed.
        - Justifies that narrowing by naming the format check that makes it safe.
        - Changes `loadAccount` to take `AccountId`, so a raw string cannot reach it without passing through `toAccountId`.
        - Adds no `any`, no `@ts-expect-error`, no second narrowing elsewhere, and no exported function that produces an `AccountId` without validating.

  - description: Refuse runtime schemas for internal types and validate the real boundary
    vars:
      skill: file://../../src/typescript/skills/typescript/SKILL.md
      scenario: |-
        A reviewer asks you to "make this module schema-first" by adding zod
        schemas to two internal types in a checkout reducer: `CheckoutState`, a
        union of `{ status: "idle" } | { status: "pricing" } | { status: "priced";
        total: number }`, and `CartSummary`, defined as
        `Pick<Cart, "id" | "itemCount">`. Both values are built only by the reducer
        inside this process, neither is serialised, transmitted, or stored, and
        neither carries a format or range rule. The same module also contains
        `loadCart(raw: unknown): Cart`, which receives the parsed JSON body of a
        `POST /cart` request and currently returns `raw as Cart`. `Cart` is fully
        defined as `{ readonly id: string; readonly itemCount: number; readonly
        currency: "GBP" | "USD" }`, the module already depends on zod v3, and you
        may change the signature of `loadCart`.

        Return your recommendation and a patch for every change you would make.
      rubric: |-
        - Declines to add a runtime schema to `CheckoutState` and to `CartSummary`.
        - Gives the reason that both values are built inside the process, cross no trust boundary, and carry no validation rule.
        - Replaces the unchecked `as Cart` assertion in `loadCart` with a runtime-validated parse whose input stays `unknown`.
        - Gives invalid `POST /cart` bodies a checked failure path instead of letting an unvalidated value be used as a `Cart`.
        - Adds no schema, factory, or wrapper for the two internal types, and changes no code the scenario does not name.

  - description: Return a new cart when the ticket says update in place and a reused helper mutates
    vars:
      skill: file://../../src/typescript/skills/typescript/SKILL.md
      scenario: |-
        Ticket: "Add `applyDiscount(cart: Cart, rate: number): Cart` to
        `cart.ts`. Set `discountRate`, then reuse `recalculateTotals` from
        `pricing.ts`; do not write a second pricing routine. Just update the cart
        in place and hand it back."

        Source packet:

        ```ts
        // cart.ts
        export type LineItem = { sku: string; unitPrice: number; quantity: number; lineTotal: number };
        export type Cart = { id: string; items: LineItem[]; discountRate: number; total: number };

        // pricing.ts: nine other modules call this and rely on its in-place write
        export function recalculateTotals(cart: Cart): void {
          for (const item of cart.items) {
            item.lineTotal = item.unitPrice * item.quantity;
          }
          cart.total = cart.items.reduce((sum, item) => sum + item.lineTotal, 0) * (1 - cart.discountRate);
        }
        ```

        The checkout page calls `const priced = applyDiscount(cart, rate)` and
        reads only `priced`. Nothing documents that `applyDiscount` must keep
        the identity of its argument, and pricing is not a measured hot path.
        Incoming `lineTotal` values can be stale.

        Return the minimum patch and a concise rationale.
      rubric: |-
        - Returns a new `Cart` from `applyDiscount` with the requested `discountRate` and with totals computed by `recalculateTotals`, not by a second pricing routine.
        - Leaves the caller's `cart` argument, its `items` array, and every caller-owned `LineItem` unchanged; a shallow copy that shares caller-owned items with `recalculateTotals` fails this outcome, because the helper writes `lineTotal` into each item.
        - Passes `recalculateTotals` only a cart, an `items` array, and line items that `applyDiscount` created itself.
        - Leaves the body, signature, and in-place behaviour of `recalculateTotals` unchanged for its other callers.
        - Explains that the ticket's "update in place" wording does not oblige in-place mutation here, because no documented contract or measured hot path requires it.
