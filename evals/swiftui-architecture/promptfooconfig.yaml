# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: SwiftUI architecture skill versus no-skill baseline

prompts:
  - id: file://prompts/baseline.txt
    label: baseline
  - id: file://prompts/with-skill.txt
    label: with-skill

providers:
  - id: openai:codex-sdk
    config:
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false

defaultTest:
  assert:
    - type: agent-rubric
      metric: rubric
      threshold: 1
      value: |-
        Judge only whether the proposed SwiftUI architecture reaches the safe,
        predictable outcome requested by this scenario. Give equal weight to
        every criterion below. Credit explicit, scenario-specific ownership,
        data-flow, and lifecycle decisions. Do not reward verbosity, copied
        rubric wording, or invented project facts.

        {{rubric}}
      provider:
        id: openai:codex-sdk
        config:
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false

tests:
  - description: Keep shared session ownership singular without lifting local UI state
    vars:
      skill: file://../../src/app/skills/swiftui-architecture/SKILL.md
      reference: file://../../src/app/skills/swiftui-architecture/references/state-management.md
      scenario: >-
        Design the state ownership for a SwiftUI app whose signed-in account is
        read and changed from three tabs and a settings sheet. The search field
        and sheet presentation flag are used only by the settings screen. A
        teammate proposes one ObservableObject AppViewModel singleton containing
        the account manager, search text, and presentation flag, with every tab
        creating it through @StateObject. Give the smallest modern SwiftUI
        architecture and data flow; do not execute commands or invent project
        details.
      rubric: |-
        - Rejects per-tab `@StateObject` ownership and gives the shared account/session service exactly one lifetime owner at the app or shared feature root.
        - Uses an `@Observable` account/session service retained with `@State` by that owner and injected through `.environment(...)`, with consumers reading it through `@Environment(Service.self)`.
        - Keeps the search field and sheet presentation flag as local `@State` in the settings view instead of lifting UI-only state into the shared service.
        - Keeps shared account mutations as explicit service actions or upward actions while data flows down, rather than allowing multiple screens to own competing copies.

  - description: Make type-ahead search lifecycle-bound and resistant to stale results
    vars:
      skill: file://../../src/app/skills/swiftui-architecture/SKILL.md
      reference: file://../../src/app/skills/swiftui-architecture/references/async-patterns.md
      scenario: >-
        Design a SwiftUI type-ahead search screen. The current proposal creates a
        SearchViewModel with ObservableObject and Combine debounce, then launches
        an unstructured Task from onChange for every keystroke. Slow earlier
        requests can overwrite newer results, and requests continue after the
        screen disappears. Search text and results belong only to this screen;
        an injected API service already exposes `search(_:) async throws`. Give
        the smallest modern data flow and lifecycle design, including empty-query,
        cancellation, loading, and error behavior; do not execute commands or
        invent results.
      rubric: |-
        - Keeps screen-only query, results, and presentation state in local `@State`, uses the injected async API service directly, and adds neither a ViewModel nor Combine.
        - Starts search from `.task(id: query)` so SwiftUI cancels work when the query changes or the view disappears, rather than launching unstructured tasks from `onChange`.
        - Handles the empty query before calling the service by clearing results and returning to an idle state.
        - Models idle/loading/loaded/failed explicitly enough that the UI cannot show stale results as a successful response to a newer query.
        - Treats cancellation as a non-error terminal for the superseded request, propagates or checks cancellation before publishing results, and exposes a retry through the same structured async path.

  - description: Decline to redesign UIKit internals and answer only at the SwiftUI boundary
    vars:
      skill: file://../../src/app/skills/swiftui-architecture/SKILL.md
      reference: file://../../src/app/skills/swiftui-architecture/references/anti-patterns.md
      scenario: >-
        A shipping iOS app has a UIKit screen, `LegacyChartViewController`,
        whose chart view draws in `draw(_:)`. A UIKit coordinator presents the
        screen, and an RxSwift view model feeds it. A new SwiftUI settings
        screen must show the same chart. You are asked two things: first,
        restructure the UIKit controller, its coordinator, and its RxSwift
        bindings into a cleaner MVVM-C layering; second, say how the new SwiftUI
        screen can display the chart. Answer both requests as far as your
        guidance allows; do not execute commands, read files, or invent project
        details.
      rubric: |-
        - States plainly that this guidance covers SwiftUI only and declines to redesign the UIKit controller, its coordinator, or its RxSwift bindings.
        - Answers the second request by naming `UIViewControllerRepresentable` as the wrapper that shows the existing controller inside SwiftUI, and does not offer `UIHostingController` for that direction.
        - Keeps any SwiftUI-side advice to state the new screen owns, such as local `@State` or values passed into the wrapper, without moving the UIKit screen's state into SwiftUI.
        - Does not propose an MVVM-C or RxSwift layering, and does not present a UIKit rewrite as the recommended path.
        - Does not invent project details (file names, chart data model, existing services) beyond the scenario, and does not claim to have inspected code or run anything.

  - description: Keep single-screen state local instead of promoting it to a shared service
    vars:
      skill: file://../../src/app/skills/swiftui-architecture/SKILL.md
      reference: file://../../src/app/skills/swiftui-architecture/references/state-management.md
      scenario: >-
        A SwiftUI `OrderHistoryScreen` shows a list of orders. It has a sort
        order (date or amount), a set of expanded row identifiers, and a filter
        chip selection. The sort control and the filter chips live in a child
        `OrderFilterBar` view; the rows live in a child `OrderRowList` view; both
        children are placed directly by `OrderHistoryScreen`. None of these three
        values is read anywhere else in the app, and none must survive the screen
        being dismissed. A teammate proposes adding all three to the existing
        app-wide `AppSettings` `@Observable` service that is already injected
        through the environment, arguing that two child views need them. Decide
        where each value lives and how the children read and change it. Also
        state what would have to change for any of these values to belong in a
        shared service; do not execute commands or invent project details.
      rubric: |-
        - Rejects moving the three values into the app-wide `AppSettings` service and keeps each one in view-local `@State`, owned either by `OrderHistoryScreen` or by the single child that uses it.
        - Answers the second question with at least one specific change that would justify a shared service, such as the value having to survive dismissal or being read by an unrelated feature.
        - Passes the values to the children by argument, `@Binding`, or callback rather than by environment injection, and says which child writes which value.
        - Warns about a concrete cost of the proposed shared placement, for example the value persisting after dismissal, or every view that reads the promoted value being invalidated when it changes.
        - Does not invent extra requirements such as persistence, deep links, or other screens reading these values, and does not claim to have inspected the project.

  - description: Stop a superseded save from reporting its outcome
    vars:
      skill: file://../../src/app/skills/swiftui-architecture/SKILL.md
      reference: file://../../src/app/skills/swiftui-architecture/references/async-patterns.md
      scenario: >-
        A SwiftUI `ProfileEditorScreen` holds draft name and bio fields that no
        other screen reads. A Save button calls `save(_:) async throws` on an
        injected profile service. The button action currently starts a bare
        `Task { }`. Testers report two faults: tapping Save twice quickly can
        show the first, slower save's error alert after the second save already
        succeeded; and dismissing the screen while a save runs leaves the work
        with nothing to report to. Design the smallest data flow so the screen
        never shows the outcome of a save that a later save replaced, and state
        what happens to a save that is in flight when the screen disappears; do
        not execute commands or invent project details.
      rubric: |-
        - Keeps the draft fields and the save status in local `@State` on the screen and calls the injected service directly, adding neither a ViewModel nor Combine.
        - Gives the in-flight save one named owner, such as a `Task` held in `@State` that is cancelled before a new save starts, or a single-flight rule that blocks a second save while one runs.
        - Guarantees a superseded save cannot write the status, for example by cancelling it and checking cancellation before publishing any result or error.
        - Decides explicitly what happens on disappearance, either cancelling the task from the view or handing it to a longer-lived owner, and says which behaviour it chose.
        - Treats cancellation as a non-error outcome so no error alert is shown for a cancelled or superseded save, and does not invent APIs or persistence details beyond `save(_:) async throws`.
