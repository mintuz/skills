# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: TDD skill versus no-skill baseline

prompts:
  - id: file://prompts/baseline.txt
    label: baseline
  - id: file://prompts/with-skill.txt
    label: with-skill

providers:
  - id: openai:codex-sdk
    config:
      working_dir: ./workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false

defaultTest:
  assert:
    - type: agent-rubric
      metric: rubric
      threshold: 1
      value: |-
        Judge only whether the proposed TDD sequence reaches every observable
        outcome required by this scenario. Give equal weight to every outcome
        below. Credit explicit commands, state transitions, and stopping
        conditions rather than copied rubric wording or generic TDD advice.

        {{rubric}}
      provider:
        id: openai:codex-sdk
        config:
          working_dir: ./workspace
          skip_git_repo_check: true
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_enabled: false
          cli_config:
            features:
              apps: false
              plugins: false
              skill_search: false

tests:
  - description: Reject a false red caused by a broken test harness
    vars:
      skill: file://../../src/web/skills/tdd/SKILL.md
      scenario: |-
        You are adding `parseRetryAfter(value: string): number | null` to an
        existing TypeScript package. The first new Vitest case expects
        `parseRetryAfter("30")` to equal `30`. It lives in
        `test/parseRetryAfter.test.ts` and is named `returns 30 for "30"`. The
        run fails before any
        assertion with `Cannot find module '../src/parseRetryAfter'`. The package
        has no `src/` directory at all: its sources live under `lib/`, and every
        existing test imports the public `index.ts` entry point. A teammate
        says, "red is red; implement the function now and sort out the test
        harness later." There is no request to add dependencies or commit.

        Return the exact RED-to-GREEN patch and command sequence you would use.
        Include the evidence required at each transition and stop once this one
        behavior is green; do not invent repository-specific command names. State
        also what you would do if the repaired test passed instead of failing.
      rubric: |-
        - Rejects the teammate's "red is red" advice: it treats the deep `../src/parseRetryAfter` import as the fault, given that the package has no `src/` directory, and writes no production code from that failure.
        - Repairs the test to import through the public `index.ts` entry point, then reruns only the new case and requires it to fail on the missing `parseRetryAfter` behavior itself, such as an undefined export or a wrong returned value.
        - Treats an unexpected pass after the repair as evidence that the behavior already exists or the test is ineffective, and pauses to inspect or strengthen the test instead of adding production code.
        - Only after that valid RED, adds the smallest implementation and public export needed for the string `"30"` case; it does not add date parsing, validation branches, a dependency, or speculative retry policy.
        - Reruns the focused case to prove GREEN, then stops this slice: no commit, no refactor, and no further cases.

  - description: Preserve a dirty worktree while proving a regression RED
    vars:
      skill: file://../../src/web/skills/tdd/SKILL.md
      scenario: |-
        Fix a regression in `applyCredit(balance, amount)`: `amount === 0`
        currently throws, but should return the unchanged balance. Before TDD
        started, the working tree already contained the user's unrelated edits
        in `src/report.ts`. Your own uncommitted attempt has already added an
        `amount === 0` branch to `src/credit.ts`. You have also already written the
        regression test in `test/credit.test.ts`, and it passed on its first run.
        The user explicitly says: "Use TDD, do not commit,
        stash, reset, or touch my other changes." The focused test command is
        `npx vitest run test/credit.test.ts`, the package regression suite runs
        with `npm test`, and `applyCredit` is a public export.

        Return the safest patch/state and RED-GREEN-REFACTOR sequence. Explain
        what proves each transition and what remains untouched.
      rubric: |-
        - Attributes the regression test's pass to the author's own `src/credit.ts` attempt rather than to correct production behavior, and does not treat that pass as RED evidence.
        - Removes or reverses only the author's `src/credit.ts` attempt while preserving both the new test and the user's unrelated `src/report.ts` edits, then runs the focused test and requires the intended zero-amount behavior assertion to fail against pre-fix production behavior.
        - Applies the smallest zero-amount fix only after that observed RED, reruns the focused test to GREEN, and runs the relevant existing regression suite before declaring the change safe.
        - Honors the explicit no-commit, no-stash, no-reset boundary and never discards, stages, rewrites, or claims ownership of `src/report.ts`.
        - Assesses refactoring only after GREEN and leaves the minimal branch alone when no concrete cleanup improves it; it reports the final working-tree state and test evidence without a commit.

  - description: Refuse to keep spike production code as if it were tested
    vars:
      skill: file://../../src/web/skills/tdd/SKILL.md
      scenario: |-
        You must integrate `@vendor/feed-parser`, whose output shape is
        undocumented. To learn the shape you wrote a throwaway script and ran it
        once. That script now sits in `src/feedImport.ts` and already maps the
        vendor output into the app's `Article` shape well enough that the app
        compiles and the page renders. No test covers any of it. The single
        observed vendor response was an object with `items`, and each item held
        `title` (a string) and `published_at` (the ISO 8601 string
        `"2026-03-01T09:00:00Z"`); you observed no other field. The app's
        `Article` type is `{ title: string; publishedAt: Date }`. Your lead says:
        "the spike works and the page renders, so keep it and move on."

        State what you keep, what you remove, and the exact cycle you run next.
      rubric: |-
        - Rules out the compiling app and the rendering page as test evidence for `src/feedImport.ts`, and declines the lead's "keep it and move on".
        - Keeps the knowledge the spike produced (the observed `items`, `title`, `published_at` shape) while removing or setting aside the untested `src/feedImport.ts` production code before the cycle starts.
        - Writes one failing behavior test for the smallest mapping behavior, runs it against production code that lacks the mapping, and requires that observed failure before any implementation returns.
        - Reintroduces the mapping one behavior at a time, adding only the code the current failing test demands rather than pasting the whole spike back.
        - Does not invent vendor fields beyond `items`, `title`, and `published_at`, and does not claim the spike run or the rendered page counts as a passing test.

  - description: Resolve a write-all-tests-first instruction against one failing test
    vars:
      skill: file://../../src/web/skills/tdd/SKILL.md
      scenario: |-
        A `validatePassword(password)` helper must satisfy seven acceptance
        rules from a written spec: minimum length, one upper case letter, one
        lower case letter, one digit, one symbol, no character repeated three
        times in a row, and not present in a supplied banned list. The tech lead
        instructs: "write all seven Vitest cases first, get the whole file red in
        one run, then implement the validator in one pass." The team's merge gate
        also requires 100% line coverage. Vitest is available, and a focused test
        command can select a single test by name.

        Resolve the conflict and give the exact working sequence.
      rubric: |-
        - Rejects or amends the lead's single implementation pass, and produces no step in which all seven tests fail together before implementation starts.
        - Keeps exactly one test written and failing at a time, holding the remaining six as a requirements list or as empty placeholders rather than as six written test bodies, and runs one Red-Green-Refactor cycle per rule.
        - Describes each cycle concretely: run the focused test to observe the failure, add only the code that one rule needs, then rerun to GREEN before starting the next rule.
        - Treats 100% line coverage as a by-product measured after the cycles finish, not as a separate task, and adds no test aimed at a line rather than a behavior.
        - Does not drop, disable, or weaken any of the seven rules to satisfy the one-pass instruction, and does not invent an eighth rule or specific banned-list contents.

  - description: Limit refactoring to code that green tests cover
    vars:
      skill: file://../../src/web/skills/tdd/SKILL.md
      scenario: |-
        `calculateInvoiceTotal` has just gone green, and behavior tests cover it.
        The same file holds `legacyExportCsv`, which has no test at all and
        repeats the same rounding expression three times. The user says: "while
        you are in there, refactor everything you can see, including
        `legacyExportCsv`, and extract the shared rounding helper. It is trivial
        code, so writing tests for it would waste a day." Commits are allowed on
        this branch. Other packages import the public signatures of
        both functions.

        Give the refactoring plan and state what you will not do.
      rubric: |-
        - Secures a reversible GREEN baseline before any refactoring edit, and because commits are allowed here it commits the passing code first.
        - Changes `calculateInvoiceTotal` only while its behavior tests stay green and reruns those tests afterwards, or states that it found no cleanup worth making there and leaves it unchanged.
        - Declines to refactor the untested `legacyExportCsv` as asked; it either writes characterisation tests pinning the current CSV output first or leaves that function untouched, and says which option it takes.
        - Keeps both public signatures unchanged because other packages import them, and keeps the refactoring change separate from any behavior change.
        - Does not assert that extracting the rounding expression from `legacyExportCsv` is safe without tests, and does not invent that function's current behavior or a coverage figure.
