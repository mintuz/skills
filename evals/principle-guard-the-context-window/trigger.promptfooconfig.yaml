description: "principle-guard-the-context-window activation and exclusion"
prompts:
  - id: file://prompts/trigger.txt
    label: trigger
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  - description: "Selects relevant guidance"
    vars:
      request: "A 40,000-line CI log was already printed in full once and the first error is at line 31,240. I now need to know whether checkout.spec also timed out and which NODE_OPTIONS the job used. How should I read the log?"
    assert:
      - type: skill-used
        value: principle-guard-the-context-window
  - description: "Excludes writing a pause handover"
    vars:
      request: "I need to stop for today. Help me write a handover note for whoever continues this migration tomorrow; they won't see this chat."
    assert:
      - type: not-skill-used
        value: principle-guard-the-context-window
