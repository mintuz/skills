description: "principle-attack-the-premise activation and exclusion"
prompts:
  - id: file://prompts/trigger.txt
    label: trigger
providers:
  -
    id: openai:codex-sdk
    config:
      model: gpt-6-astra
      model_reasoning_effort: medium
      codex_path_override: codex
      working_dir: ./trigger-workspace
      skip_git_repo_check: true
      sandbox_mode: read-only
      approval_policy: never
      network_access_enabled: false
      web_search_enabled: false
      cli_config:
        features:
          apps: false
          plugins: false
          skill_search: false
tests:
  - description: Selects relevant guidance
    vars:
      request: "Two retry-delay changes failed to fix duplicate jobs. Both assumed each acknowledgement means the job committed. Duplicates are distributed evenly across workers. A colleague concludes the even census proves that premise correct and wants a third delay. Give your next investigation and its stopping condition."
    assert:
      - type: skill-used
        value: principle-attack-the-premise
  - description: Excludes a plain translation
    vars:
      request: "Translate only this sentence into French: The green notebook is on the table."
    assert:
      - type: not-skill-used
        value: principle-attack-the-premise
